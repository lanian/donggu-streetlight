# http {} 안에 include하는 예시. 공개 앱 파일만 /var/www/donggu-light 에 복사합니다.
map $uri $donggu_cache_control {
    default "no-cache";
    ~^/(?:data|vendor|icons|seed)/ "public, max-age=86400";
}
server {
    listen 443 ssl;
    server_name light.donggu.kr;                 # 실제 도메인으로
    ssl_certificate     /etc/letsencrypt/live/light.donggu.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/light.donggu.kr/privkey.pem;
    root /var/www/donggu-light;
    index index.html;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # location에서 add_header를 재정의하지 않아 보안 헤더도 함께 상속됩니다.
    add_header Cache-Control $donggu_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(self)" always;
    location = /manifest.webmanifest { default_type application/manifest+json; }
    location = /report/config.js { try_files $uri =404; }
    location = /firebase-config.js { try_files $uri =404; }
    location /report/ { try_files $uri $uri/ /report/index.html; }
    location / { try_files $uri $uri/ =404; }
    location ~ ^/(?:functions|scripts|docs|deploy|\.) { deny all; }
    location ~ ^/(?:firestore\.(?:rules|indexes\.json)|firebase\.json|package(?:-lock)?\.json)$ { deny all; }
}
server { listen 80; server_name light.donggu.kr; return 301 https://$host$request_uri; }
