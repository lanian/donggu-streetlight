# 구청 웹서버(nginx)에 정적 파일로 올릴 때 — 저장소 내용을 /var/www/donggu-light 에 복사
server {
    listen 443 ssl http2;
    server_name light.donggu.kr;                 # 실제 도메인으로
    ssl_certificate     /etc/letsencrypt/live/light.donggu.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/light.donggu.kr/privkey.pem;
    root /var/www/donggu-light;
    index index.html;

    types { application/manifest+json webmanifest; }
    # 앱 셸·서비스 워커는 항상 새로 확인, 나머지(대장·라이브러리·아이콘)는 오래 캐시
    location = /index.html   { add_header Cache-Control "no-cache"; }
    location = /sw.js        { add_header Cache-Control "no-cache"; }
    location = /firebase-config.js { add_header Cache-Control "no-cache"; }
    location /report/        { add_header Cache-Control "no-cache"; try_files $uri $uri/ /report/index.html; }
    location ~* \.(json|js|png|svg)$ { add_header Cache-Control "public, max-age=604800"; }
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(self)";
}
server { listen 80; server_name light.donggu.kr; return 301 https://$host$request_uri; }
