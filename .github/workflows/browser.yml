name: Local browser workflows

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install isolated browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/donggu-browser" --no-audit --no-fund --ignore-scripts playwright@1.58.2
          node "$RUNNER_TEMP/donggu-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify field, recovery, operations, and lighting context
        env:
          DONGGU_PLAYWRIGHT_MODULE: ${{ runner.temp }}/donggu-browser/node_modules/playwright
        run: |
          node scripts/field-browser-smoke.cjs
          node scripts/integration-ui-smoke.cjs
          node scripts/operations-browser-smoke.cjs
          node scripts/brightness-smoke.cjs
          node scripts/obstruction-browser-smoke.cjs
          node scripts/field-workflows-browser-smoke.cjs
          node scripts/lighting-workflows-smoke.cjs
          node scripts/lighting-areas-browser-smoke.cjs
          node scripts/polygon-editor-browser-smoke.cjs
          node scripts/lighting-review-navigation-smoke.cjs
          node scripts/review-fixes-smoke.cjs
          node scripts/sheet-transitions-browser-smoke.cjs
          node scripts/navigation-browser-smoke.cjs
          node scripts/navigation-state-browser-smoke.cjs
          node scripts/navigation-history-browser-smoke.cjs
          node scripts/bottom-nav-browser-smoke.cjs
          node scripts/desktop-ui-browser-smoke.cjs
          node scripts/pc-location-browser-smoke.cjs
          node scripts/patrol-compact-browser-smoke.cjs
          node scripts/patrol-map-browser-smoke.cjs
          node scripts/dialog-browser-smoke.cjs
          node scripts/map-view-browser-smoke.cjs
          node scripts/visit-plan-browser-smoke.cjs
          node scripts/visit-driving-browser-smoke.cjs
          node scripts/dark-mode-browser-smoke.cjs
          node scripts/device-profile-browser-smoke.cjs
          node scripts/update-check-browser-smoke.cjs
          node scripts/version-info-browser-smoke.cjs
          node scripts/roles-status-browser-smoke.cjs
          node scripts/qr-report-badge-browser-smoke.cjs
          node scripts/security-browser-smoke.cjs
          node scripts/privacy-browser-smoke.cjs
          node scripts/status-integrity-browser-smoke.cjs
          node scripts/patrol-field-browser-smoke.cjs
          node scripts/offline-reload-browser-smoke.cjs
          node scripts/report-page-browser-smoke.cjs
          node scripts/official-report-browser-smoke.cjs
          node scripts/work-improvements-browser-smoke.cjs
          node scripts/inventory-improvements-browser-smoke.cjs
          node scripts/patrol-functional-browser-smoke.cjs
          node scripts/asset-maintenance-browser-smoke.cjs
          node scripts/essential-work-browser-smoke.cjs
          node scripts/inspection-field-kit-v61-browser-smoke.cjs
          node scripts/satellite-map-browser-smoke.cjs
          node scripts/marker-selection-browser-smoke.cjs
          node scripts/print-lifecycle-browser-smoke.cjs
          node scripts/report-output-browser-smoke.cjs
          node scripts/roadlighting-registry-browser-smoke.cjs
          node scripts/roadlighting-bridge-browser-smoke.cjs
          node scripts/official-report-import-browser-smoke.cjs
          node scripts/official-ledger-connector-browser-smoke.cjs
