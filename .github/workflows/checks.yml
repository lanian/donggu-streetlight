name: App and rules checks

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check source, registry, and regressions
        run: node scripts/check.mjs

  firestore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked Functions dependencies without lifecycle scripts
        run: npm ci --prefix functions --include=optional --ignore-scripts --no-audit --no-fund
      - name: Verify Functions input, image, and audit behavior
        run: npm test --prefix functions
      - name: Install isolated emulator test tools
        run: npm install --prefix "$RUNNER_TEMP/donggu-tools" --no-audit --no-fund --ignore-scripts firebase-tools@15.34.1 @firebase/rules-unit-testing@3.0.3 firebase@10.12.2
      - name: Verify access rules and server operations sequentially
        env:
          NODE_PATH: ${{ runner.temp }}/donggu-tools/node_modules
        run: '"$RUNNER_TEMP/donggu-tools/node_modules/.bin/firebase" emulators:exec --only firestore --project demo-donggu-streetlight "node scripts/check-emulator.cjs"'
