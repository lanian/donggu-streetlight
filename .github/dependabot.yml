# Weekly update proposals for the pinned workflow actions and the Cloud Functions packages. Only patch/minor
# updates (and security fixes) are proposed; a major version is upgraded deliberately, reviewed together with the
# workflow it changes. Updates arrive as pull requests through the same checks; nothing is merged automatically.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
