<style>
:root{
  --ink:#16233D; --ink-2:#4A5873; --line:#D8DEE8; --bg:#EEF1F5; --card:#FFFFFF;
  --sodium:#E89A0C; --sodium-soft:#FFF1D6; --ok:#2C7A57; --ok-soft:#E1F2EA;
  --warn:#B86E00; --warn-soft:#FFF0D9; --bad:#C2372B; --bad-soft:#FBE4E1;
  --fix:#2F5DA8; --fix-soft:#E2EAF7;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#E8ECF3; --ink-2:#A3AEC2; --line:#2C3850; --bg:#0F1726; --card:#17223A;
    --sodium:#F5B03A; --sodium-soft:#3A2E14; --ok:#5CC495; --ok-soft:#173528;
    --warn:#F0A945; --warn-soft:#3A2A10; --bad:#F07A6E; --bad-soft:#3D1B19;
    --fix:#7FA6E8; --fix-soft:#1A2A47;
  }
}
:root[data-theme="dark"]{
  --ink:#E8ECF3; --ink-2:#A3AEC2; --line:#2C3850; --bg:#0F1726; --card:#17223A;
  --sodium:#F5B03A; --sodium-soft:#3A2E14; --ok:#5CC495; --ok-soft:#173528;
  --warn:#F0A945; --warn-soft:#3A2A10; --bad:#F07A6E; --bad-soft:#3D1B19;
  --fix:#7FA6E8; --fix-soft:#1A2A47;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sodium);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 110px}

/* header: the lamp head is the one bold element */
header.top{padding:22px 0 14px;display:flex;align-items:flex-end;gap:12px}
header.top>div:first-of-type{flex:1;min-width:0}header.top>div:last-child{flex:none}
header p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lamp{width:46px;height:58px;flex:none}
.lamp .glow{fill:var(--sodium)}
header h1{font-size:22px;line-height:1.25;margin:0;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
@media(max-width:420px){header h1{font-size:19px}header p{font-size:12px}}
header p{margin:2px 0 0;color:var(--ink-2);font-size:13px}
.sync{margin-left:auto;font-size:12px;color:var(--ink-2);white-space:nowrap}
.sync i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin-right:5px;vertical-align:1px}
.sync.on i{background:var(--ok)}

.tally{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 18px}
.tally button{border:0;border-radius:10px;padding:10px 8px 8px;text-align:left;background:var(--card);border-top:4px solid var(--c)}
.tally b{display:block;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.tally span{font-size:12px;color:var(--ink-2)}
.tally button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--c)}

h2{font-size:17px;margin:22px 0 10px;font-weight:700}
h3{font-size:15px;margin:0 0 6px}
.muted{color:var(--ink-2);font-size:13px}
.panel{background:var(--card);border-radius:12px;padding:14px;border:1px solid var(--line)}

.tools{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tools input,.tools select{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
.tools input{flex:1 1 150px}
.tools select{flex:0 1 auto;max-width:40%}
.tools .btn.sm{white-space:nowrap;flex:none}

.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;text-align:left;width:100%}
.row .code{font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.row .addr{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{margin-left:auto;text-align:right;flex:none}
.row .body{min-width:0;flex:1}
.pole{width:6px;align-self:stretch;border-radius:3px;background:var(--c);flex:none}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--cs);color:var(--c);white-space:nowrap}
.due{display:block;font-size:11px;color:var(--warn);margin-top:3px}
/* kind badge: the colour of the plate on the pole — green 가로등, blue 보안등 */
.kind{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;color:#fff;vertical-align:1px;margin-right:4px;letter-spacing:.02em}
.k-가로등{background:#1E7A4A}.k-보안등{background:#2A47B8}.k-공원등{background:#8A6A1F}.k-특이등{background:#6B3FA0}
.kindseg{margin:0 0 10px}
.reg{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:4px;margin-right:4px;vertical-align:1px;background:var(--sodium-soft);color:var(--warn);border:1px solid var(--warn)}
.reg.np{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.reg.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.pend{border-left:5px solid var(--sodium)}
.pend .thumb{max-height:140px;width:auto}
.kindseg button i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.kindseg button[aria-pressed="true"] i{outline:1px solid #fff8}
.kindtab{display:grid;grid-template-columns:1fr auto auto auto auto;gap:6px 10px;font-size:13px;align-items:center}
.kindtab .h{color:var(--ink-2);font-size:11px}
.kindtab b{font-variant-numeric:tabular-nums}

.st-정상{--c:var(--ok);--cs:var(--ok-soft)}
.st-점검필요{--c:var(--warn);--cs:var(--warn-soft)}
.st-고장{--c:var(--bad);--cs:var(--bad-soft)}
.st-수리중{--c:var(--fix);--cs:var(--fix-soft)}
.st-접수{--c:var(--bad);--cs:var(--bad-soft)}
.st-처리중{--c:var(--fix);--cs:var(--fix-soft)}
.st-완료{--c:var(--ok);--cs:var(--ok-soft)}

/* forms */
label.f{display:block;margin:12px 0 4px;font-size:13px;font-weight:600}
.f-in{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
textarea.f-in{min-height:84px;resize:vertical}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:600;background:var(--ink);color:var(--bg)}
.btn.sodium{background:var(--sodium);color:#1B1300}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:8px;min-height:36px}
/* primary field actions: big, thumb-sized, one row */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 14px}
.ptwrap{background:#0F1726;color:#E6ECF7;border-radius:14px;padding:12px;margin-top:8px}
.pthud{display:flex;justify-content:space-between;font-size:13px;color:#A9B6CC;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.pthud b{color:#fff;font-size:22px;font-weight:800}
.ptahead{display:flex;flex-direction:column;gap:6px;min-height:120px}
.ptcard{display:flex;align-items:center;gap:10px;background:#1A2538;border:2px solid transparent;border-radius:12px;padding:10px 12px;color:#fff;text-align:left;font-size:15px}
.ptcard.first{border-color:#E89A0C;background:#243049}
.ptcard .d{margin-left:auto;font-size:20px;font-weight:800;white-space:nowrap}
.ptcard .side{font-size:12px;color:#A9B6CC}
.ptcard.st-고장,.ptcard.st-수리중{box-shadow:inset 4px 0 0 var(--bad)}.ptcard.st-점검필요{box-shadow:inset 4px 0 0 var(--warn)}
.ptbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.ptbtns button{min-height:76px;border-radius:14px;border:0;font-size:19px;font-weight:800;color:#fff}
.ptbtns .bad{background:#C2372B}.ptbtns .warn{background:#B8740A}.ptbtns .ok{background:#2E8B57}.ptbtns .spot{background:#5B4B9E}.ptbtns button[hidden]{display:none}
.ptprog{display:flex;gap:8px;align-items:center;margin:0 0 8px;font-size:12px;color:#A9B6CC}.ptprog select{font:inherit;font-size:13px;background:#1A2538;color:#fff;border:1px solid #3A4A66;border-radius:8px;padding:4px 6px}.ptprog .bar{flex:1;height:8px;background:#1A2538;border-radius:4px;overflow:hidden}.ptprog .bar i{display:block;height:100%;background:#2E8B57;transition:width .3s}.ptbtns .undo{background:#2F3B52;grid-column:1/-1;min-height:48px;font-size:15px;font-weight:600}

<script>
"use strict";
/* 법정동 as printed on the 보안등 plates in the registry (data/lights.json, from getPoint.json) */
const DONGS=["계림동","광산동","궁동","금남로1가","금남로2가","금남로3가","금남로4가","금남로5가","금동","남동","대의동","대인동","동명동","불로동","산수동","서석동","소태동","수기동","용산동","운림동","월남동","장동","지산동","충장로1가","충장로2가","충장로3가","충장로4가","충장로5가","학동","호남동","황금동"];
// longest first so 황금동 wins over 금동, 호남동 over 남동
const DONGS_M=[...DONGS].sort((a,b)=>b.length-a.length);
const dongRe=d=>/동$/.test(d)?d.replace(/동$/,"\\s*동"):d.replace(/(로)(\d)(가)$/,"$1\\s*$2\\s*$3");
const KINDS=["가로등","보안등","특이등","공원등"];
const KIND_COL={"가로등":"#1E7A4A","보안등":"#2A47B8","공원등":"#8A6A1F","특이등":"#6B3FA0"};
const kindBadge=k=>`<span class="kind k-${esc(k||"가로등")}">${esc(k||"가로등")}</span>`;
function kindChips(cur,id,counts){const ks=["전체",...KINDS.filter(k=>!counts||counts[k])];return `<div class="seg kindseg" id="${id}">${ks.map(k=>`<button type="button" data-kind="${k}" aria-pressed="${k===cur}">${k==="전체"?"":`<i style="background:${KIND_COL[k]}"></i>`}${k}${counts&&k!=="전체"?` <span class="muted" style="font-size:11px">${counts[k]}</span>`:""}</button>`).join("")}</div>`}
const kindCounts=arr=>{const c={};arr.forEach(l=>{c[l.kind||"가로등"]=(c[l.kind||"가로등"]||0)+1});return c};
const isPlateDong=k=>k!=="가로등"; // 보안등·특이등·공원등 plates carry a dong name
/* Two label types in Dong-gu:
   - 보안등 (blue plate):  "<행정동> <번호>"            e.g. 산수동 642        → {kind:"보안등",dong,num}
   - 가로등 (green plate): "<도로명> <번호>-<가지번호>"  e.g. 지호로 65-5, 140-8 → {kind:"가로등",road?,main,sub} */
const codeOf=(dong,num)=>`${dong} ${num}`;
const glCode=(road,main,sub)=>`${road?road+" ":""}${main}${sub!=null&&sub!==""?"-"+sub:""}`;
const roadSlug=r=>{let x=0;for(const ch of String(r||""))x=(x*31+ch.codePointAt(0))>>>0;return r?x.toString(36):"x"};
const glId=(road,main,sub)=>`gl-${roadSlug(road)}-${main}-${sub}`;
const labelText=p=>!p?"":p.kind==="가로등"?glCode(p.road,p.main,p.sub):codeOf(p.dong,p.num);
const idOf=(dong,num)=>`bd-${roadSlug(dong)}-${num}`;
const newIdFor=p=>p.kind==="가로등"?glId(p.road,p.main,p.sub):idOf(p.dong,p.num);
const nrm=v=>v==null||v===""?"":String(v).split("-").map(x=>String(+x)).join("-"); // 063 → 63, 204-016 → 204-16
// find a registered light for a parsed label (prefers ones still standing)
function lookup(p){
  if(!p)return null;
  const live=a=>a.find(l=>!l.removed)||a[0]||null;
  if(p.kind==="가로등"){
    const m=nrm(p.main),s=nrm(p.sub);
    const cands=S.lights.filter(l=>l.kind==="가로등"&&nrm(l.main)===m&&nrm(l.sub)===s);
    if(p.road){const exact=cands.filter(l=>l.road===p.road);if(exact.length)return live(exact)}
    const noRoad=cands.filter(l=>!p.road||!l.road);
    return live(noRoad)||(cands.length===1?cands[0]:null)||S.lights.find(l=>l.code===labelText(p))||null;
  }
  const n=nrm(p.num);
  return live(S.lights.filter(l=>isPlateDong(l.kind)&&l.dong===p.dong&&nrm(l.num)===n))||S.lights.find(l=>l.code===codeOf(p.dong,p.num))||null;
}
const ROAD_RE=/([\uac00-\ud7a3]{1,8}?(?:대로|로|길))\s*(\d{1,4})\s*-\s*(\d{1,3})(?![\d-])/;      // 지호로 65-5
const GL_RE=/(?<![\d-])(\d{1,4})\s*-\s*(\d{1,3})(?![\d-]|\s*-\s*\d)/;   // 140-8, not phone 608-2894, not 1544-1555, not 2022-11-26
function parseCode(text){
  if(!text)return null;let t=String(text).replace(/\s+/g," ");
  if(/^https?:|[?&](?:no|num|id|code|lamp)=/i.test(t)){const u=t.match(/(?:no|num|id|code|lamp)=([^&#]+)/i);if(u){let v=u[1].trim();try{v=decodeURIComponent(v.replace(/\+/g," "))}catch(e){}const q=parseCode(v);if(q)return q}}
  for(const d of DONGS_M){const m=t.match(new RegExp("(?:^|[^\\uac00-\\ud7a3])"+dongRe(d)+"\\s*(\\d{1,5}(?:\\s*-\\s*\\d{1,3}){0,2})(?![\\d-])"));if(m)return{kind:"보안등",dong:d,num:m[1].replace(/\s+/g,"")}}
  const r=t.match(ROAD_RE);if(r)return{kind:"가로등",road:r[1],main:r[2],sub:r[3]};
  const g=t.match(GL_RE);if(g)return{kind:"가로등",road:"",main:g[1],sub:g[2]};
  return null;
}
// OCR text is noisy: match the first two syllables of a dong name, tolerate a wrong third syllable
function parseCodeFuzzy(text){
  const p=parseCode(text);if(p)return p;
  const t=String(text||"").replace(/[^\uac00-\ud7a3\d\s-]/g," ").replace(/\s+/g," ");
  for(const d of DONGS_M){if(/가$/.test(d))continue;const m=t.match(new RegExp(d.slice(0,2)+"\\s?[\uac00-\ud7a3]?\\s*(\\d{1,5})(?!\\s*-)"));if(m)return{kind:"보안등",dong:d,num:m[1]}}
  return null;
}
// parse what a person typed into a 표찰 번호 field (with an optional dong chosen separately)
function parseTyped(num,dong){
  const t=String(num||"").trim();if(!t)return null;
  if(dong&&/^\d{1,5}(\s*-\s*\d{1,3}){0,2}$/.test(t)){const q={kind:"보안등",dong,num:t.replace(/\s+/g,"")};if(lookup(q))return q}
  const g=t.match(/^(\d{1,4})\s*-\s*(\d{1,3})$/);if(g)return{kind:"가로등",road:"",main:g[1],sub:g[2]};
  const p=parseCode(t);if(p)return p;
  const n=t.replace(/\D/g,"");if(n&&dong)return{kind:"보안등",dong,num:n};
  return null;
}
function parsePole(text){const m=String(text||"").replace(/\s+/g,"").match(/\d{4}[A-Z]\d{3}/);return m?m[0]:null}

/* Local fallback store (GitHub Pages / plain hosting): same API surface as the shared db,
   backed by this browser's localStorage, seeded from seed/manifest.json. Not shared between devices. */
function localDb(){
  const KEY="donggu-streetlight-local";let data={lights:{},inspections:{},reports:{},patrols:{},roles:{},photos:{}};const subs=[];
  try{const s=localStorage.getItem(KEY);if(s)data=JSON.parse(s)}catch(e){}
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}subs.forEach(f=>f())};
  const snapOf=(col,q)=>{let rows=Object.entries(data[col]||{}).map(([id,d])=>({id,data:()=>d}));
    if(q.where)rows=rows.filter(r=>r.data()[q.where[0]]===q.where[2]);
    if(q.order)rows.sort((x,y)=>{const a=x.data()[q.order[0]]||0,b=y.data()[q.order[0]]||0;return q.order[1]==="desc"?b-a:a-b});
    if(q.lim)rows=rows.slice(0,q.lim);return{docs:rows}};
  const query=(col,q={})=>({
    where:(f,op,v)=>query(col,{...q,where:[f,op,v]}),orderBy:(f,d)=>query(col,{...q,order:[f,d]}),limit:n=>query(col,{...q,lim:n}),
    get:async()=>snapOf(col,q),
    onSnapshot:cb=>{const f=()=>cb(snapOf(col,q));subs.push(f);f();return()=>{const i=subs.indexOf(f);if(i>=0)subs.splice(i,1)}},
    add:async rec=>{const id="l"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);(data[col]=data[col]||{})[id]=rec;save();return{id}}
  });
  const seed=async()=>{
    try{const mf=await (await fetch("seed/manifest.json",{cache:"no-cache"})).json();
      const m=Array.isArray(mf)?mf:mf.docs,ver=Array.isArray(mf)?1:mf.version;
      const refresh=data.seedVersion!==ver;
      // a new seed version means the sample data changed: drop everything stored by older seeds (and test records made against them)
      if(refresh&&mf.purge){data.lights={};data.inspections={};data.reports={};data.register={}}
      const todo=refresh?m:m.filter(e=>!(data[e.collection]&&data[e.collection][e.doc_id]));
      await Promise.all(todo.map(async e=>{const d=await (await fetch("seed/"+e.file,{cache:"no-cache"})).json();(data[e.collection]=data[e.collection]||{})[e.doc_id]=d}));
      if(refresh||todo.length){data.seedVersion=ver;save()}}catch(e){}
  };
  return{seed,collection:c=>query(c),doc:path=>{const [c,id]=path.split("/");return{
    set:async rec=>{(data[c]=data[c]||{})[id]=rec;save()},
    get:async()=>{const d=(data[c]||{})[id];return{id,exists:!!d,data:()=>d}},
    update:async patch=>{data[c][id]=Object.assign(data[c][id]||{},patch);save()},
    delete:async()=>{if(data[c])delete data[c][id];save()}}}};
}
/* Registry: the light list ships with the page (data/lights.json, converted from getPoint.json).
   The shared "lights" collection only holds what changes in the field — status, last inspection —
   keyed by the same id, plus any light registered by hand. Field values win over the registry. */
let BASE=[],OV={},LIDX=null;
const addrOf=o=>[o.pole,o.sw?`점멸 ${o.sw}`:"",o.removed?"철거":"",o.noPlate?"표찰 없음":"",o.dongGuess?"동은 위치로 추정":""].filter(Boolean).join(" · ");
async function loadRegistry(){
  try{
    const j=await (await fetch("data/lights.json",{cache:"no-cache"})).json();
    BASE=j.rows.map(row=>{const o={};j.cols.forEach((c,i)=>{if(row[i]!=null)o[c]=row[i]});o.status="정상";o.lastInspected=null;o.address=addrOf(o);return o});
  }catch(e){S.regErr=true}
  mergeLights();
}
function mergeLights(){
  const seen=new Set();
  const out=BASE.map(b=>{seen.add(b.id);const o=OV[b.id];if(!o)return b;const m={...b,...o,id:b.id};if("pole"in o||"sw"in o||"removed"in o||"noPlate"in o)m.address=addrOf(m);return m});
  for(const [id,o] of Object.entries(OV))if(!seen.has(id)&&o.code)out.push({...o,id});
  S.lights=out;LIDX=null;LG=null;
}
function onLights(snap){OV={};snap.docs.forEach(d=>{OV[d.id]=d.data()});mergeLights()}

// Downscale a photo. Returns a JPEG data URL; compressBlob returns a Blob too (no data: fetch needed).
async function decodeFile(file){
  if(window.createImageBitmap){try{return await createImageBitmap(file,{imageOrientation:"from-image"})}catch(e){}}
  return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(url);res(img)};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("decode"))};img.src=url});
}
async function compressBlob(file,max=640,q=.6){
  const img=await decodeFile(file);
  const w=img.width||img.naturalWidth,hh=img.height||img.naturalHeight;
  const r=Math.min(1,max/Math.max(w,hh));const c=document.createElement("canvas");c.width=Math.round(w*r);c.height=Math.round(hh*r);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);if(img.close)img.close();
  const url=c.toDataURL("image/jpeg",q);
  const blob=await new Promise(res=>c.toBlob(b=>res(b),"image/jpeg",q));
  return{url,blob:blob||null,canvas:c};
}
async function compress(file){return (await compressBlob(file)).url}

  document.querySelectorAll("nav.tabs button").forEach(b=>{b.hidden=!allowed[b.dataset.tab];b.setAttribute("aria-selected",b.dataset.tab===S.tab)});

function mapSVG(){
  const pts=S.lights.filter(l=>typeof l.lat==="number"&&typeof l.lng==="number");
  if(!pts.length)return `<div class="empty">위치 정보가 있는 가로등이 없어요.</div>`;
  const W=340,H=250,p=18;
  let a=Math.min(...pts.map(l=>l.lat)),b=Math.max(...pts.map(l=>l.lat)),c=Math.min(...pts.map(l=>l.lng)),d=Math.max(...pts.map(l=>l.lng));
  if(b-a<.004){a-=.002;b+=.002} if(d-c<.004){c-=.002;d+=.002}
  const x=g=>p+(g-c)/(d-c)*(W-2*p),y=t=>p+(b-t)/(b-a)*(H-2*p);
  const groups={};pts.forEach(l=>{(groups[l.dong]=groups[l.dong]||[]).push(l)});
  const labels=Object.entries(groups).filter(([k,v])=>v.length>=100).map(([k,v])=>{const mx=v.reduce((s,l)=>s+x(l.lng),0)/v.length,my=v.reduce((s,l)=>s+y(l.lat),0)/v.length;return `<text class="dong" x="${mx.toFixed(1)}" y="${(my-9).toFixed(1)}" text-anchor="middle">${esc(k)}</text>`}).join("");
  const col={"정상":"var(--ok)","점검필요":"var(--warn)","고장":"var(--bad)","수리중":"var(--fix)"};
  // 5,000+ lights: normal ones are one path of tiny dots, only lights needing action are clickable circles
  const dots=pts.filter(l=>l.status==="정상").map(l=>`M${x(l.lng).toFixed(1)} ${y(l.lat).toFixed(1)}h1.3v1.3h-1.3z`).join("");
  const order=pts.filter(l=>l.status!=="정상");
  return `<svg class="map" viewBox="0 0 ${W} ${H}" role="img" aria-label="동구 가로등 위치 분포">
    <rect x="1" y="1" width="${W-2}" height="${H-2}" rx="10" fill="var(--bg)"/>
    <path d="${dots}" fill="var(--ok)" opacity=".55"/>
    ${labels}
    ${order.map(l=>`<circle data-light="${esc(l.id)}" cx="${x(l.lng).toFixed(1)}" cy="${y(l.lat).toFixed(1)}" r="4.5" fill="${col[l.status]||"var(--ink-2)"}"><title>${esc(l.code)} ${esc(l.status)}</title></circle>`).join("")}
  </svg>
  <div class="legend">${LSTAT.map(s=>`<span class="st-${s}"><i></i>${s}</span>`).join("")}</div>`;
}

function suggestResult(){
  const bad=CHECKS.filter(([k])=>draft.checks[k]==="bad").map(([k])=>k);
  const severe=bad.some(k=>["lamp","leak","pole"].includes(k));
  const r=Object.keys(draft.checks).length===0?null:severe?"고장":bad.length?"점검필요":"정상";
  if(r&&!draft.manual){draft.result=r;document.querySelectorAll("#resSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.res===r))}
  const h=$("#resHint");if(h)h.textContent=severe?"점등·누전·등주 불량은 고장으로 제안돼요.":bad.length?`불량 ${bad.length}개 항목이 있어요.`:"불량 항목을 체크하면 결과가 자동으로 제안돼요.";
}
async function saveInspection(){
  const l=byId(draft.lightId);if(!l)return;
  const done=Object.keys(draft.checks).length;
  if(done<CHECKS.length){toast(`점검 항목 ${CHECKS.length-done}개가 남았어요.`);return}
  if(!draft.result){toast("점검 결과를 선택해 주세요.");return}
  const btn=$("#saveInsp");btn.disabled=true;btn.textContent="저장 중…";
  const now=Date.now();
  const faults=CHECKS.filter(([k])=>draft.checks[k]==="bad").map(([,t])=>t);
  const rec={lightId:l.id,code:l.code,dong:l.dong,date:now,checks:{...draft.checks},faults,result:draft.result,memo:($("#iMemo").value||"").trim().slice(0,1000),inspector:S.me||null};
  if(typeof draft.tilt==="number")rec.tiltDeg=draft.tilt;
  if(draft.photo)rec.photo=draft.photo;
  const photos=draft.photos||[];
  const ok=await write(async()=>{
    if(photos.length){rec.thumbs=[];for(const ph of photos){const ref=await db.collection("photos").add({lightId:l.id,code:l.code,dong:l.dong,label:ph.label,note:ph.note||"",data:ph.data,w:ph.w,h:ph.h,at:now,by:S.me||null,kind:"inspection"});rec.thumbs.push({id:ref.id,label:ph.label,t:ph.thumb})}rec.photoN=photos.length}
    const iref=await db.collection("inspections").add(rec);
    if(rec.thumbs)for(const t of rec.thumbs)try{await db.doc("photos/"+t.id).update({inspId:iref.id})}catch(e){}
    await patchLight(l.id,{status:draft.result,lastInspected:now,lastResult:draft.result,updatedAt:now})},"점검 결과를 저장했어요.");
  if(ok)closeSheet();else if(btn){btn.disabled=false;btn.textContent="점검 결과 저장"}
}

function onTilt(e){

  n.textContent=avg.toFixed(1)+"°";n.style.color=avg>=TILT_WARN?"var(--bad)":"var(--ok)";

}

/* ---------- brightness estimate & gap review ----------
   A model, not a measurement: each light gets an effective radius from its kind and lamp type (a 9m 가로등 pole
   lights farther than a 5m 보안등 on a KEPCO pole), broken lights count as dark, and the midpoint between every pair
   of neighbouring lights is checked for weak combined light. Without road geometry, a candidate only says
   "two lights are farther apart than their reach — walk this stretch". Thresholds live in LIGHT_MODEL. */
const LIGHT_MODEL={
  radius:{"가로등":18,"보안등":11,"공원등":9,"특이등":11},
  lamp:{"LED일반형":1,"LED소켓형":.8,"CDM":.95,"메탈":1,"나트륨":.85,"삼파장":.6},
  status:{"정상":1,"점검필요":.75,"고장":0,"수리중":0},
  pairMax:{"가로등":95,"보안등":62,"공원등":50,"특이등":62},
  gapFactor:1.15,   // pair spacing beyond (r1+r2)×factor is a gap candidate
  weak:.3           // combined light at the midpoint below this is "weak"
};
let CALIB=null; // per-kind spacing the district actually uses (90th percentile of nearest-neighbour distance)
const reachOf=l=>{const base=CALIB&&CALIB[l.kind]?CALIB[l.kind].r:(LIGHT_MODEL.radius[l.kind]||11);return Math.round(base*(LIGHT_MODEL.lamp[l.lampType]||.9)*10)/10};
const onOf=l=>l.removed?0:(LIGHT_MODEL.status[l.status]??1);
let LG=null; // metric grid of lights for neighbour queries
function lightGrid(){
  if(LG&&LG.n===S.lights.length)return LG;
  const pts=S.lights.filter(l=>typeof l.lat==="number"&&typeof l.lng==="number");
  const lat0=35.14,lng0=126.93,kx=111320*Math.cos(lat0*Math.PI/180),ky=110540,cell=30,cells=new Map();
  const items=pts.map(l=>{const x=(l.lng-lng0)*kx,y=(l.lat-lat0)*ky;const it={l,x,y,r:0,on:onOf(l)};const k=`${Math.floor(x/cell)},${Math.floor(y/cell)}`;(cells.get(k)||cells.set(k,[]).get(k)).push(it);return it});
  const near=(x,y,R)=>{const out=[];const c0=Math.floor((x-R)/cell),c1=Math.floor((x+R)/cell),r0=Math.floor((y-R)/cell),r1=Math.floor((y+R)/cell);
    for(let cx=c0;cx<=c1;cx++)for(let cy=r0;cy<=r1;cy++){const b=cells.get(`${cx},${cy}`);if(b)for(const it of b){const d=Math.hypot(it.x-x,it.y-y);if(d<=R)out.push({it,d})}}return out};
  // calibrate: what spacing is normal here? the widest 10% of neighbour gaps per kind become the review threshold
  CALIB={};for(const k of KINDS){const ds=items.filter(it=>it.l.kind===k&&!it.l.removed).map(me=>{let best=999;for(const {it,d} of near(me.x,me.y,120))if(it!==me&&!it.l.removed&&d<best)best=d;return best}).filter(d=>d<999).sort((a,b)=>a-b);
    if(ds.length>=30){const p90=ds[Math.floor(ds.length*.9)];CALIB[k]={p50:Math.round(ds[Math.floor(ds.length*.5)]),p90:Math.round(p90),r:Math.max(8,Math.round(p90/(2*LIGHT_MODEL.gapFactor)*10)/10)}}}

  return LG={n:S.lights.length,items,near,lightAt,toLL:(x,y)=>({lat:lat0+y/ky,lng:lng0+x/kx}),toXY:l=>({x:(l.lng-lng0)*kx,y:(l.lat-lat0)*ky})};
}
function lightReview(dong,kind){
  const G=lightGrid();const seen=new Set();const cands=[];
  const items=G.items.filter(it=>(dong==="전체"||it.l.dong===dong)&&(kind==="전체"||it.l.kind===kind)&&!it.l.removed);
  for(const a of items){
    const R=LIGHT_MODEL.pairMax[a.l.kind]||62;
    for(const {it:b,d} of G.near(a.x,a.y,R)){
      if(b===a||b.l.removed||b.l.id<a.l.id)continue;
      if(kind!=="전체"&&b.l.kind!==kind)continue;

function roadReview(dong,kind){
  const G=lightGrid();if(!ROADS)return[];

  const areas=roadAreas(G);const inArea=(x,y)=>{for(const a of areas)if(x>=a.x0&&x<=a.x1&&y>=a.y0&&y<=a.y1&&pointInPoly(x,y,a.poly))return a.t;return""};

        const sdong=nearL[0]?nearL[0].dong:"";
        if(dong!=="전체"&&sdong!==dong){acc=[];return}
        const dark=nb.some(o=>o.d<70&&o.it.on===0);

    ${r.plate?`<div style="display:flex;gap:10px;align-items:flex-start;margin-top:8px"><img src="${r.plate}" alt="인식한 표찰 영역" style="width:96px;border-radius:6px;border:1px solid var(--line)"><div class="muted">${r.pick&&r.pick.auto===false?"표찰을 자동으로 찾지 못했어요. ":""}${r.code?"이 영역에서 읽었어요. 틀리면 아래에서 고치세요.":"이 영역에서 번호를 읽지 못했어요. 표찰을 보고 직접 적거나 영역을 지정하세요."}<div class="split" style="margin-top:6px"><button class="btn ghost sm" id="cropManual">영역 직접 지정</button></div></div></div>`:""}
    ${r.pick?`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--line)">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 8px">
        <div><label class="f" for="pkKind" style="margin-top:0">종류</label><select class="f-in" id="pkKind">${KINDS.map(k=>`<option ${k===r.pick.kind?"selected":""}>${k}</option>`).join("")}</select></div>
        <div><label class="f" for="pkNum" style="margin-top:0">번호</label><input class="f-in" id="pkNum" value="${esc(r.pick.num)}" placeholder="${r.pick.kind==="가로등"?"65-5":"642"}"></div>
        <div id="pkDongBox" ${r.pick.kind==="가로등"?"hidden":""}><label class="f" for="pkDong">동 이름</label><select class="f-in" id="pkDong"><option value="">선택</option>${DONGS.map(d=>`<option ${d===r.pick.dong?"selected":""}>${d}</option>`).join("")}</select></div>
        <div id="pkRoadBox" ${r.pick.kind==="가로등"?"":"hidden"}><label class="f" for="pkRoad">도로명</label><input class="f-in" id="pkRoad" list="roadList" value="${esc(r.pick.road)}" placeholder="지호로"><datalist id="roadList">${knownRoads().map(x=>`<option value="${esc(x)}">`).join("")}</datalist></div>
      </div>
      <div class="split"><button class="btn sm" id="pkGo">${r.code?"수정한 번호로 확인":"이 번호로 확인"}</button></div></div>`:""}
    <div class="split">
      ${r.code&&l&&scan.ctx==="inspect"?`<button class="btn" data-apply="open">이 등 점검하기</button>`:""}
      ${r.code&&l&&scan.ctx==="admin"?`<button class="btn" data-apply="open">이 등 열기</button>`:""}
      ${r.code&&!l&&S.canWrite&&scan.ctx!=="report"?`<button class="btn" data-apply="register">미등록 양식에 넣기</button>${scan.pos?`<button class="btn ghost" data-apply="quick">현재 위치로 바로 저장</button>`:""}`:""}
      ${r.code&&scan.ctx==="report"?`<button class="btn sodium" data-apply="report">신고 양식에 넣기</button>`:""}
      ${r.code&&!l&&scan.ctx==="inspect"&&S.canWrite?`<button class="btn ghost" data-apply="register">신규 등록</button>`:""}
      <button class="btn ghost" id="scanStart">다시 스캔</button>
    </div></div>`;
  box.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function applyScan(what){
  const r=scan.found;if(!r||!r.code)return;
  const p=r.code,txt=labelText(p),l=lookup(p);
  if(what==="open"){if(!l)return;stopCam(false);openLight(l.id);return}
  if(what==="quick"){if(!scan.pos){toast("위치를 아직 못 잡았어요.");return}const id=newIdFor(p);if(byId(id)){toast("이미 저장된 번호예요.");return}
    const rec={code:txt,dong:p.dong||(DONGS.includes(p.road)?p.road:""),kind:p.kind,num:p.num||null,road:p.road||null,main:p.main||null,sub:p.sub||null,poleNo:r.pole||null,address:"",lampType:"",status:"정상",lastInspected:null,reg:"미등록",lat:scan.pos.lat,lng:scan.pos.lng,acc:Math.round(scan.pos.acc||0),photo:r.plate||null,foundAt:Date.now(),foundBy:S.me||null,updatedAt:Date.now(),note:"표찰 스캔에서 바로 저장"};
    if(!rec.dong){const near=S.lights.filter(x=>typeof x.lat==="number").map(x=>({x,d:distM(scan.pos,x)})).sort((a,b)=>a.d-b.d)[0];if(near)rec.dong=near.x.dong}
    write(()=>db.doc("lights/"+id).set(rec),`${txt}을(를) 미등록으로 저장했어요. 관리 현황에서 확인하세요.`).then(ok=>{if(ok){closeSheet();S.tab="admin";render()}});return}
  stopCam(false);closeSheet();
  if(what==="report"){S.tab="report";render();$("#rNum").value=p.kind==="가로등"?txt:p.num;if(p.dong)$("#rDong").value=p.dong;else if(l)$("#rDong").value=l.dong;$("#rLoc").focus();toast(`${txt} 번호를 넣었어요.`);return}
  if(what==="register"){S.tab="admin";render();const d=$("#nDong");if(!d){toast("등록 권한이 없어요.");return}
    $("#nNoPlate").checked=false;["nNum","nRoad"].forEach(x=>{const el=$("#"+x);if(el)el.disabled=false});
    $("#nKind").value=p.kind;$("#nNum").value=p.kind==="가로등"?`${p.main}-${p.sub}`:p.num;$("#nNum").placeholder=p.kind==="가로등"?"65-5":"642";$("#nRoadBox").hidden=p.kind!=="가로등";if(p.road)$("#nRoad").value=p.road;if(p.dong)d.value=p.dong;if(r.pole)$("#nPole").value=r.pole;
    $("#nAddr").scrollIntoView({behavior:"smooth",block:"center"});$("#nAddr").focus();toast(`${txt} 번호를 넣었어요. ${p.kind==="가로등"?"행정동과 ":""}위치를 적고 등록하세요.`)}
}
/* photo stage: shown instead of the camera once a photo is chosen */
function showStage(src,box,status){
  const cp=$("#camPanel"),st=$("#photoStage");if(!cp||!st)return;
  cp.hidden=true;st.hidden=false;const pk=$("#photoPick");if(pk)pk.hidden=true;
  const c=$("#stageCanvas");const maxW=st.clientWidth||340;const k=Math.min(1,maxW/src.width,(window.innerHeight*.42)/src.height);
  c.width=Math.round(src.width*k);c.height=Math.round(src.height*k);c.style.width=c.width+"px";c.style.height=c.height+"px";
  const g=c.getContext("2d");g.drawImage(src,0,0,c.width,c.height);
  if(box){g.strokeStyle="#E89A0C";g.lineWidth=3;g.setLineDash([8,5]);g.strokeRect(box.x*k,box.y*k,box.w*k,box.h*k);g.setLineDash([]);
    g.fillStyle="rgba(0,0,0,.35)";g.fillRect(0,0,c.width,box.y*k);g.fillRect(0,(box.y+box.h)*k,c.width,c.height-(box.y+box.h)*k);g.fillRect(0,box.y*k,box.x*k,box.h*k);g.fillRect((box.x+box.w)*k,box.y*k,c.width-(box.x+box.w)*k,box.h*k)}
  stageStatus(status);
  st.scrollIntoView({behavior:"smooth",block:"start"});
}
function stageStatus(t,spin=true){const s=$("#stageStatus");if(!s)return;s.innerHTML=t?`${spin?'<span class="spin"></span>':""}${esc(t)}`:"";s.hidden=!t}
function backToCam(){const cp=$("#camPanel"),st=$("#photoStage");if(cp)cp.hidden=false;if(st)st.hidden=true;const r=$("#scanResult");if(r)r.innerHTML="";startCam()}
async function readLabelPhoto(file){
  if(scan.busy){toast("아직 앞 사진을 읽는 중이에요.");return}
  scan.busy=true;stopCam(false);
  const box=$("#scanResult");if(box)box.innerHTML="";
  let src;
  try{const big=await compressBlob(file,2400,.92);src=big.canvas;ocrState.src=src}
  catch(e){scan.busy=false;showScanResult({code:null,raw:`이 사진 파일을 열 수 없어요(${file.type||"형식 미상"}). 카메라로 바로 찍거나 JPG로 올려 주세요.`,how:"photo",pick:{kind:"보안등",num:"",dong:"",road:""}});return}
  const plateBox=findPlate(src);ocrState.box=plateBox;
  showStage(src,plateBox,plateBox?"표찰을 찾았어요. QR 확인 중…":"표찰 틀을 자동으로 찾지 못했어요. 사진 전체를 읽어요…");
  // 1) QR: plate crop first (small QRs decode better after cropping), then the whole photo
  try{
    const tries=[];if(plateBox){tries.push(cropTo(src,plateBox,1000));tries.push(cropTo(src,plateBox,1600))}
    const whole=cropTo(src,{x:0,y:0,w:src.width,h:src.height},Math.min(1600,src.width));tries.push(whole);
    for(const c of tries){const d=c.getContext("2d").getImageData(0,0,c.width,c.height);const r=window.jsQR&&jsQR(d.data,c.width,c.height,{inversionAttempts:"attemptBoth"});if(r&&r.data&&parseCode(r.data)){scan.busy=false;stageStatus("QR에서 읽었어요",false);onDecoded(r.data,"qr");return}}
  }catch(e){}
  // 2) demo mode → on-device OCR
  if(!window.claude||!window.claude.use){scan.busy=false;await ocrLabel(null,file,plateBox||undefined);return}
  // 3) shared link → Claude reads the plate (send the crop at full detail, plus the whole photo for context)
  if(!sampleNs){try{sampleNs=await claude.use("sample");const lim=await sampleNs.limits();scan.sampleImg=!!(lim&&lim.images);scan.maxImg=lim&&lim.images?lim.images.maxCount:1}catch(e){}}
  if(!sampleNs||!scan.sampleImg){scan.busy=false;showScanResult({code:null,raw:"이 계정/화면에서는 사진 인식을 쓸 수 없어요. 아래에서 번호를 직접 입력해 주세요.",how:"photo",pick:{kind:"보안등",num:"",dong:"",road:""}});return}
  stageStatus("AI가 표찰을 읽는 중… (처음이면 사진 전송 동의 창이 떠요)");
  try{
    const toBlob=c=>new Promise(res=>c.toBlob(b=>res(b),"image/jpeg",.85));
    const imgs=[];
    if(plateBox)imgs.push(await toBlob(cropTo(src,plateBox,1000)));
    if(!plateBox||(scan.maxImg||1)>=2)imgs.push(await toBlob(cropTo(src,{x:0,y:0,w:src.width,h:src.height},Math.min(1200,src.width))));
    const plateUrl=plateBox?cropTo(src,plateBox,480).toDataURL("image/jpeg",.7):null;
    const out=await sampleNs.json(`사진은 한국 광주광역시 동구의 가로등 또는 보안등 기둥입니다.${plateBox?" 첫 번째 사진은 표찰만 잘라 확대한 것이고, 두 번째가 있다면 전체 장면입니다.":""} 기둥에 붙은 관리 표찰을 읽어 주세요. 표찰은 두 종류입니다.
1) 가로등 표찰(초록색 머리띠에 "가로등", 왼쪽에 파란 세로 띠 "관리번호"): 도로명(예: 지호로)과 그 아래 큰 숫자 "번호-가지번호"(예: 65-5)가 있습니다. 도로명이 없는 옛 표찰은 숫자만(예: 140-8) 있습니다. 이때 kind="가로등", road="지호로"(없으면 null), num="65-5".
2) 보안등 표찰(파란색, "보안등 고장신고"): 동 이름(${DONGS.join(", ")} 중 하나)과 그 아래 큰 숫자가 있습니다. 예: 산수동 642, 충장로5가 030. 이때 kind="보안등", dong="산수동", num="642".
표찰의 전화번호(608-xxxx 등)는 번호가 아니니 무시하세요. 현수막·광고의 숫자도 무시하세요.
3) 한국전력 전주번호판(흰색, "위험"): 숫자4자리+영문1자+숫자3자리 형식(예: 9792C742) → pole.
반드시 아래 JSON 하나만 출력하세요. 못 읽은 항목은 null로 두세요.
{"kind": "가로등"|"보안등"|null, "dong": string|null, "road": string|null, "num": string|null, "pole": string|null, "confidence": "high"|"low"}`,{images:imgs,modelTier:"quick"});
    const dn=out&&typeof out.dong==="string"?out.dong.replace(/\s/g,""):"";
    const dong=DONGS.find(d=>d===dn)||DONGS_M.find(d=>dn&&d.length>=3&&!/가$/.test(d)&&dn.startsWith(d.replace(/동$/,"")));
    const numRaw=out&&out.num?String(out.num).trim():"";
    const pole=parsePole(out&&out.pole||"");
    let code=null;
    const g=numRaw.match(/^(\d{1,4})\s*-\s*(\d{1,3})$/);
    const road=out&&typeof out.road==="string"?out.road.replace(/\s/g,""):"";
    if(g&&out.kind!=="보안등")code={kind:"가로등",road,main:g[1],sub:g[2]};
    else{const n=numRaw.replace(/\D/g,"");if(dong&&n)code={kind:"보안등",dong,num:n};else if(g)code={kind:"가로등",road,main:g[1],sub:g[2]}}
    const kind=code?code.kind:(out&&out.kind||"보안등");
    stageStatus(code?"읽었어요. 아래에서 확인하세요.":"번호를 읽지 못했어요.",false);
    showScanResult({code,pole,kind,how:"photo",plate:plateUrl,raw:code?"":`인식 결과: ${JSON.stringify(out)}`,pick:{kind,num:code?(code.kind==="가로등"?`${code.main}-${code.sub}`:code.num):numRaw,dong:dong||"",road:road||"",auto:!!plateBox}});
    if(out&&out.confidence==="low"&&code)toast("표찰이 흐려 번호가 틀릴 수 있어요. 확인해 주세요.");
  }catch(e){
    const code=e&&e.code;
    const msg=code==="not_granted"?"사진 인식에 동의하지 않아 번호를 읽지 못했어요. 아래에서 직접 입력해 주세요.":code==="rate_limited"?"요청이 많아요. 잠시 후 다시 시도해 주세요.":code==="image_rejected"||code==="images_unavailable"?"이 사진 형식은 보낼 수 없어요. 카메라로 바로 찍은 JPG로 다시 시도해 주세요.":`사진에서 표찰을 읽지 못했어요. 더 가까이서 다시 찍어 주세요.${code?` (${code})`:""}`;
    stageStatus("",false);
    showScanResult({code:null,raw:msg,how:"photo",pick:{kind:"보안등",num:"",dong:"",road:""}});
  }finally{scan.busy=false}
}
document.addEventListener("change",e=>{if(e.target.id==="scanPhoto"||e.target.id==="scanPhotoLib"){const f=e.target.files&&e.target.files[0];if(f)readLabelPhoto(f)}});

render();
try{if(localStorage.getItem("dg-near")==="1"){S.near=false;nearToggle()}}catch(e){}
boot().then(()=>{idbGet("roads").then(r=>{if(r&&r.ver===ROADS_VER&&r.ways&&r.ways.length){ROADS=r;if(S.tab==="admin")render()}})});
