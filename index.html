<style>
:root{
  --ink:#16233D; --ink-2:#4A5873; --line:#D8DEE8; --bg:#EEF1F5; --card:#FFFFFF;
  --sodium:#E89A0C; --sodium-soft:#FFF1D6; --ok:#2C7A57; --ok-soft:#E1F2EA;
  --warn:#B86E00; --warn-soft:#FFF0D9; --bad:#C2372B; --bad-soft:#FBE4E1;
  --fix:#2F5DA8; --fix-soft:#E2EAF7;
  --font:"Pretendard Variable",Pretendard,"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --r-panel:12px; --r-ctl:10px; --r-tile:16px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#E8ECF3; --ink-2:#A3AEC2; --line:#2C3850; --bg:#0F1726; --card:#17223A;
    --sodium:#F5B03A; --sodium-soft:#3A2E14; --ok:#5CC495; --ok-soft:#173528;
    --warn:#F0A945; --warn-soft:#3A2A10; --bad:#F07A6E; --bad-soft:#3D1B19;
    --fix:#7FA6E8; --fix-soft:#1A2A47;
  }
}
:root[data-theme="dark"]{
  --ink:#E8ECF3; --ink-2:#A3AEC2; --line:#2C3850; --bg:#0F1726; --card:#17223A;
  --sodium:#F5B03A; --sodium-soft:#3A2E14; --ok:#5CC495; --ok-soft:#173528;
  --warn:#F0A945; --warn-soft:#3A2A10; --bad:#F07A6E; --bad-soft:#3D1B19;
  --fix:#7FA6E8; --fix-soft:#1A2A47;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"ss05" 1}
b,strong,.code{font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--sodium);margin:0 2px;flex:none}
button{cursor:pointer}
button,.btn,.x,.themebtn{min-height:44px;min-width:44px}
input:not([type=checkbox]):not([type=radio]),select{min-height:44px}
.leaflet-touch .leaflet-bar a{width:44px;height:44px;line-height:44px}
:focus-visible{scroll-margin:80px}
[inert]{pointer-events:none}
:focus-visible{outline:3px solid var(--sodium);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 110px}

/* app bar: one line, the lamp mark is the only decoration in the app */
header.top{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:10px;margin:0 -16px 10px;padding:8px 16px;padding-top:max(8px,env(safe-area-inset-top));background:var(--bg)}
header.top>div:first-of-type{flex:1 1 0;min-width:0;display:flex;align-items:baseline;gap:8px;overflow:hidden}
header.top>div:last-child{flex:none;display:flex;flex-direction:row!important;align-items:center!important;gap:6px!important}
.lamp{width:26px;height:34px;flex:none}
.lamp .glow{fill:var(--sodium)}
header h1{font-size:17px;line-height:1.2;margin:0;font-weight:800;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
header p{margin:0;color:var(--ink-2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:430px){header p{display:none}}
.sync{font-size:11px;color:var(--ink-2);white-space:nowrap;height:28px;display:flex;align-items:center;gap:5px;padding:0 9px 0 7px;border-radius:99px;border:1px solid var(--line);background:var(--card)}
.sync.dot{padding:0;width:28px;justify-content:center}.sync.dot span{display:none}
@media(max-width:360px){.sync span{display:none}.sync{padding:0;width:28px;justify-content:center}}
.themebtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;padding:0}.themebtn svg{width:16px;height:16px}
.sync i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line);margin:0}
.sync.on i{background:var(--ok)}

.menu{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.menu button{border:1px solid var(--line);background:var(--card);border-radius:var(--r-panel);padding:12px 12px 10px;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:66px}
.menu .mt{font-weight:700;font-size:15px;display:flex;align-items:center;gap:4px}.menu .md{font-size:12px;color:var(--ink-2)}
h2 .btn.sm{font-weight:600;margin-top:-4px}
.status{margin:2px 0 14px}
.status .bar{display:flex;height:6px;border-radius:3px;overflow:hidden;gap:2px;background:var(--line)}.status .bar i{display:block;background:var(--c);min-width:3px}
.status .counts{display:flex;gap:6px;margin-top:8px;align-items:stretch}
.status .counts button{flex:1;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--card);padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:0;min-height:56px}
.status .counts button b{font-size:22px;line-height:1.1;color:var(--c)}.status .counts button span{font-size:12px;color:var(--ink-2)}
.status .counts button[aria-pressed="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);background:var(--cs)}
.status .rest{flex:1.2;padding:6px 2px 6px 8px;font-size:12px;color:var(--ink-2);line-height:1.35;align-self:center}.status .rest b{font-size:16px;color:var(--ink);margin-right:2px}
@media(max-width:360px){.status .rest{display:none}}
.tally{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 18px}
.tally button{border:0;border-radius:10px;padding:10px 8px 8px;text-align:left;background:var(--card);border-top:4px solid var(--c)}
.tally b{display:block;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.tally span{font-size:12px;color:var(--ink-2)}
.tally button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--c)}

h2{font-size:16px;margin:22px 0 10px;font-weight:800;letter-spacing:-.01em}
h3{font-size:15px;margin:0 0 6px}
.muted{color:var(--ink-2);font-size:13px}
.panel{background:var(--card);border-radius:var(--r-panel);padding:14px;border:1px solid var(--line)}

.tools{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tools input,.tools select{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--card)}
.tools input{flex:1 1 150px}
.tools select{flex:0 1 auto;max-width:40%}

"use strict";
/* 법정동 as printed on the 보안등 plates in the registry (data/lights.json, from getPoint.json) */
/* 동구 행정동 13곳과 대장의 법정동 대응. 계림·산수·지산은 1·2동으로 나뉘어 법정동만으로는 못 가르므로
   도로망과 함께 받는 행정동 경계(OSM)로 등마다 확정하고, 그 전에는 "계림동(1·2)"처럼 묶어 보여 준다. */
const ADONGS=["충장동","동명동","계림1동","계림2동","산수1동","산수2동","지산1동","지산2동","서남동","학동","학운동","지원1동","지원2동"];
const ADONG_OF={충장로1가:"충장동",충장로2가:"충장동",충장로3가:"충장동",충장로4가:"충장동",충장로5가:"충장동",금남로1가:"충장동",금남로2가:"충장동",금남로3가:"충장동",금남로4가:"충장동",금남로5가:"충장동",대인동:"충장동",수기동:"충장동",대의동:"충장동",궁동:"충장동",호남동:"충장동",장동:"충장동",불로동:"충장동",황금동:"충장동",광산동:"충장동",금동:"충장동",
  동명동:"동명동",계림동:["계림1동","계림2동"],산수동:["산수1동","산수2동"],지산동:["지산1동","지산2동"],서석동:"서남동",남동:"서남동",학동:"학동",운림동:"학운동",소태동:"지원1동",용산동:"지원1동",월남동:"지원2동"};
let ADONG_IDX=null; // light id → 행정동 (경계 데이터로 확정된 것)
function adongOf(l){if(!l)return"";if(ADONG_IDX&&ADONG_IDX[l.id])return ADONG_IDX[l.id];const m=ADONG_OF[l.dong];return Array.isArray(m)?m[0].replace(/1동$/,"동(1·2)"):(m||"")}
function adongOrder(a){const g=adongGroup(a);return ADONGS.findIndex(x=>adongGroup(x)===g)*10+(/2동$/.test(a)?2:/1동$/.test(a)?1:0)}
function adongGroup(a){return a.replace(/\(1·2\)$/,"").replace(/[12]동$/,"동")} // 계림1동/계림2동/계림동(1·2) → 계림동
function inDong(l,sel){if(!sel||sel==="전체")return true;if(sel.startsWith("a:")){const want=sel.slice(2);const have=adongOf(l);return have===want||adongGroup(have)===adongGroup(want)&&have.endsWith("(1·2)")}return l.dong===sel}
function dongLabel(sel){return !sel||sel==="전체"?"동구 전체":sel.startsWith("a:")?sel.slice(2)+" (행정동)":sel}
function dongOptions(cur,all="전체"){const groups={};for(const d of DONGS){const m=ADONG_OF[d];const g=Array.isArray(m)?adongGroup(m[0]):(m||"기타");(groups[g]=groups[g]||[]).push(d)}
  const aList=[...new Set(ADONGS.map(adongGroup))];
  return `<option value="전체" ${cur==="전체"?"selected":""}>${all==="전체"?"동구 전체":all}</option>`+aList.map(g=>{const subs=ADONGS.filter(a=>adongGroup(a)===g);const head=subs.length>1?subs.map(a=>`<option value="a:${a}" ${cur==="a:"+a?"selected":""}>${a} 전체</option>`).join(""):`<option value="a:${g}" ${cur==="a:"+g?"selected":""}>${g} 전체</option>`;return `<optgroup label="행정동 ${g}">${head}${(groups[g]||[]).map(d=>`<option value="${d}" ${d===cur?"selected":""}>　${d}</option>`).join("")}</optgroup>`}).join("")}
const DONGS=["계림동","광산동","궁동","금남로1가","금남로2가","금남로3가","금남로4가","금남로5가","금동","남동","대의동","대인동","동명동","불로동","산수동","서석동","소태동","수기동","용산동","운림동","월남동","장동","지산동","충장로1가","충장로2가","충장로3가","충장로4가","충장로5가","학동","호남동","황금동"];
// longest first so 황금동 wins over 금동, 호남동 over 남동
const DONGS_M=[...DONGS].sort((a,b)=>b.length-a.length);
const dongRe=d=>/동$/.test(d)?d.replace(/동$/,"\\s*동"):d.replace(/(로)(\d)(가)$/,"$1\\s*$2\\s*$3");
const KINDS=["가로등","보안등","특이등","공원등"];
const KIND_COL={"가로등":"#1E7A4A","보안등":"#2A47B8","공원등":"#8A6A1F","특이등":"#6B3FA0"};
const kindBadge=k=>`<span class="kind k-${esc(k||"가로등")}">${esc(k||"가로등")}</span>`;
function kindChips(cur,id,counts){const ks=["전체",...KINDS.filter(k=>!counts||counts[k])];return `<div class="seg kindseg" id="${id}">${ks.map(k=>`<button type="button" data-kind="${k}" aria-pressed="${k===cur}">${k==="전체"?"":`<i style="background:${KIND_COL[k]}"></i>`}${k}${counts&&k!=="전체"?` <span class="muted" style="font-size:11px">${counts[k]}</span>`:""}</button>`).join("")}</div>`}
const kindCounts=arr=>{const c={};arr.forEach(l=>{c[l.kind||"가로등"]=(c[l.kind||"가로등"]||0)+1});return c};
const isPlateDong=k=>k!=="가로등"; // 보안등·특이등·공원등 plates carry a dong name
/* Two label types in Dong-gu:
   - 보안등 (blue plate):  "<행정동> <번호>"            e.g. 산수동 642        → {kind:"보안등",dong,num}
   - 가로등 (green plate): "<도로명> <번호>-<가지번호>"  e.g. 지호로 65-5, 140-8 → {kind:"가로등",road?,main,sub} */
const codeOf=(dong,num)=>`${dong} ${num}`;
const glCode=(road,main,sub)=>`${road?road+" ":""}${main}${sub!=null&&sub!==""?"-"+sub:""}`;
const roadSlug=r=>{let x=0;for(const ch of String(r||""))x=(x*31+ch.codePointAt(0))>>>0;return r?x.toString(36):"x"};
const glId=(road,main,sub)=>`gl-${roadSlug(road)}-${main}-${sub}`;
const labelText=p=>!p?"":p.codeText||(p.kind==="가로등"?glCode(p.road,p.main,p.sub):codeOf(p.dong,p.num));
const idOf=(dong,num)=>`bd-${roadSlug(dong)}-${num}`;
const newIdFor=p=>p.kind==="가로등"?glId(p.road,p.main,p.sub):idOf(p.dong,p.num);
const nrm=v=>v==null||v===""?"":String(v).split("-").map(x=>String(+x)).join("-"); // 063 → 63, 204-016 → 204-16
const plateKey=v=>String(v||"").normalize("NFKC").replace(/\s+/g,"").toLowerCase();
// Keep the registry ID when a label is known: special labels and duplicate numbers cannot be reconstructed from digits alone.
function plateRef(l){return{lightId:l.id,codeText:l.code,kind:l.kind||"가로등",dong:l.dong||"",num:l.num,road:l.road||"",main:l.main,sub:l.sub}}
// find a registered light for a parsed label (prefers ones still standing)
function lookup(p){
  if(!p)return null;
  if(p.lightId)return S.lights.find(l=>l.id===p.lightId)||null;
  const live=a=>a.find(l=>!l.removed)||a[0]||null;
  if(p.kind==="가로등"){
    const m=nrm(p.main),s=nrm(p.sub);
    const cands=S.lights.filter(l=>l.kind==="가로등"&&nrm(l.main)===m&&nrm(l.sub)===s);
    if(p.road){const exact=cands.filter(l=>l.road===p.road);if(exact.length)return live(exact)}
    const noRoad=cands.filter(l=>!p.road||!l.road);
    return live(noRoad)||(cands.length===1?cands[0]:null)||S.lights.find(l=>l.code===labelText(p))||null;
  }
  const n=nrm(p.num);
  return live(S.lights.filter(l=>isPlateDong(l.kind)&&l.dong===p.dong&&nrm(l.num)===n))||S.lights.find(l=>l.code===codeOf(p.dong,p.num))||null;
}
const ROAD_RE=/([\uac00-\ud7a3]{1,8}?(?:대로|로|길))\s*(\d{1,4})\s*-\s*(\d{1,3})(?![\d-])/;      // 지호로 65-5
const GL_RE=/(?<![\d-])(\d{1,4})\s*-\s*(\d{1,3})(?![\d-]|\s*-\s*\d)/;   // 140-8, not phone 608-2894, not 1544-1555, not 2022-11-26
function parseCode(text){
  if(!text)return null;let t=String(text).replace(/\s+/g," ");
  if(/^https?:|[?&](?:c|lid|no|num|id|code|lamp)=/i.test(t)){
    try{
      const query=t.includes("?")?t.slice(t.indexOf("?")+1).split("#")[0]:t.replace(/^&/,"");
      const params=new URLSearchParams(query),id=params.get("lid");
      if(id){const l=S.lights.find(x=>x.id===id);return l?plateRef(l):null}
      for(const key of ["c","no","num","id","code","lamp"]){const value=params.get(key);if(value&&value!==t){const p=parseCode(value);if(p)return p}}
    }catch(e){}
    return null;
  }
  const exact=S.lights.filter(l=>l.code&&plateKey(l.code)===plateKey(t));
  if(exact.length)return plateRef(exact.find(l=>!l.removed)||exact[0]);
  for(const d of DONGS_M){const m=t.match(new RegExp("(?:^|[^\\uac00-\\ud7a3])"+dongRe(d)+"\\s*(\\d{1,5}(?:\\s*-\\s*\\d{1,3}){0,2})(?![\\d-])"));if(m)return{kind:"보안등",dong:d,num:m[1].replace(/\s+/g,"")}}
  const r=t.match(ROAD_RE);if(r)return{kind:"가로등",road:r[1],main:r[2],sub:r[3]};
  const g=t.match(GL_RE);if(g)return{kind:"가로등",road:"",main:g[1],sub:g[2]};
  return null;
}
// OCR text is noisy: match the first two syllables of a dong name, tolerate a wrong third syllable
function parseCodeFuzzy(text){
  const p=parseCode(text);if(p)return p;
  const t=String(text||"").replace(/[^\uac00-\ud7a3\d\s-]/g," ").replace(/\s+/g," ");
  for(const d of DONGS_M){if(/가$/.test(d))continue;const m=t.match(new RegExp(d.slice(0,2)+"\\s?[\uac00-\ud7a3]?\\s*(\\d{1,5})(?!\\s*-)"));if(m)return{kind:"보안등",dong:d,num:m[1]}}
  return null;
}
// parse what a person typed into a 표찰 번호 field (with an optional dong chosen separately)
function parseTyped(num,dong){
  const t=String(num||"").trim();if(!t)return null;
  if(dong&&/^\d{1,5}(\s*-\s*\d{1,3}){0,2}$/.test(t)){const q={kind:"보안등",dong,num:t.replace(/\s+/g,"")};if(lookup(q))return q}
  const g=t.match(/^(\d{1,4})\s*-\s*(\d{1,3})$/);if(g)return{kind:"가로등",road:"",main:g[1],sub:g[2]};
  const p=parseCode(t);if(p)return p;
  const n=t.replace(/\D/g,"");if(n&&dong)return{kind:"보안등",dong,num:n};
  return null;
}
function parsePole(text){const m=String(text||"").replace(/\s+/g,"").match(/\d{4}[A-Z]\d{3}/);return m?m[0]:null}
const LSTAT=["정상","점검필요","고장","수리중"];
const RSTAT=["접수","처리중","완료"];
const ISSUES=["불이 꺼져 있어요","깜빡거려요","낮에도 켜져 있어요","등이 파손됐어요","기둥이 기울었어요","전선이 노출됐어요","기타"];
const CHECKS=[
  ["lamp","점등 상태","야간 점등 또는 점등 시험"],
  ["flicker","깜빡임·조도","밝기 저하, 깜빡임 여부"],
  ["fixture","등기구","커버 파손, 이물질, 누수"],
  ["pole","등주","기울기, 부식, 도장 상태"],
  ["base","기초·볼트","기초 균열, 볼트 풀림"],

  ["tree","주변 간섭","수목, 간판, 시야 가림"]
];

// 표찰 QR이 여는 주민 신고 페이지: 앱이 올라간 곳의 report/ (구청 서버·Pages 어디든). 아티팩트 안에서는 Pages 주소를 씀

const INBOX_VIA=["전화","문자","이메일","방문","QR 신고 페이지","기타"]; // 주민 신고: 유지관리 부담으로 보류 (true로 바꾸면 탭·관리 섹션이 다시 켜짐)

const S={lights:[],insp:[],reports:[],patrols:[],roles:[],demoRole:null,tab:"inspect",q:"",dong:"전체",stat:null,kind:"전체",limit:60,near:false,pos:null,posWatch:null,me:null,canWrite:true,live:false,names:{}};

const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* Registry: the light list ships with the page (data/lights.json, converted from getPoint.json).
   The shared "lights" collection only holds what changes in the field — status, last inspection —
   keyed by the same id, plus any light registered by hand. Field values win over the registry. */
let BASE=[],OV={},RAW_OV={},LIGHT_FIELDS=[],LIDX=null;
const addrOf=o=>[o.pole,o.sw?`점멸 ${o.sw}`:"",o.removed?"철거":"",o.noPlate?"표찰 없음":"",o.dongGuess?"동은 위치로 추정":""].filter(Boolean).join(" · ");
async function loadRegistry(){
  try{
    const j=await (await fetch("data/lights.json",{cache:"no-cache"})).json();
    BASE=j.rows.map(row=>{const o={};j.cols.forEach((c,i)=>{if(row[i]!=null)o[c]=row[i]});o.status="정상";o.lastInspected=null;o.address=addrOf(o);return o});
  }catch(e){S.regErr=true}
  mergeLights();
}
function mergeLights(){
  const seen=new Set();
  const out=BASE.map(b=>{seen.add(b.id);const o=OV[b.id];if(!o)return b;const m={...b,...o,id:b.id};if("pole"in o||"sw"in o||"removed"in o||"noPlate"in o)m.address=addrOf(m);return m});
  for(const [id,o] of Object.entries(OV))if(!seen.has(id)&&o.code)out.push({...o,id});
  S.lights=out.filter(l=>!l._deleted);LIDX=null;LG=null;
  if(typeof invalidateLightingReview==="function")invalidateLightingReview("시설 대장 정보가 바뀌었어요.");
}
function onLights(snap){RAW_OV={};snap.docs.forEach(d=>{RAW_OV[d.id]=d.data()});OV=DGData.mergeLightFields(RAW_OV,LIGHT_FIELDS);mergeLights()}
function onLightFields(snap){LIGHT_FIELDS=snap.docs.map(d=>({id:d.id,...d.data()}));OV=DGData.mergeLightFields(RAW_OV,LIGHT_FIELDS);mergeLights();render()}
async function lightState(id,server=false){
  if(!FB&&db.mode!=="local")return byId(id)||{};
  const snap=await db.doc("lights/"+id).get(server?{source:"server"}:undefined);return snap&&snap.exists!==false&&typeof snap.data==="function"?snap.data()||{}:{};
}
// Each artifact patch is an immutable operation, because get + set cannot safely create
// a missing override concurrently. All clients reduce operations in a stable order.
async function patchLight(id,patch,operationId){
  const changes={...patch};delete changes.id;if(!Object.keys(changes).length)return;
  if(FB)return db.doc("lights/"+id).set(changes,{mergeFields:Object.keys(changes)});
  if(db.mode==="local"||S.me==="local")return db.doc("lights/"+id).update(changes);
  const op=operationId||DGData.newId("light");
  return db.doc("lightFields/"+op).set({lightId:id,changes,at:changes.updatedAt||Date.now(),by:S.me||null});
}
async function deleteLight(id){
  if(!FB&&db.mode!=="local"&&S.me!=="local"){
    // Keep a deletion tombstone: a delayed old patch must never resurrect this entry.
    await patchLight(id,{_deleted:true,updatedAt:Date.now()});
  }
  await db.doc("lights/"+id).delete();
}

/* ---------- Firebase mode (GitHub Pages + firebase-config.js): Google sign-in, Firestore with the same collection
   layout, roles enforced by firestore.rules, offline writes queued by the SDK ---------- */
let FB=null;
async function fbBoot(cfg){
  const V="10.12.2";for(const m of ["app","auth","firestore"])await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-${m}-compat.js`);
  if(!firebase.apps.length)firebase.initializeApp(cfg);
  if(cfg.appCheckSiteKey&&!window.DG_APP_CHECK_ACTIVE){await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-app-check-compat.js`);firebase.appCheck().activate(cfg.appCheckSiteKey,true);window.DG_APP_CHECK_ACTIVE=true;}
  const fs=firebase.firestore();if(window.DG_DEVICE_TRUSTED){try{await fs.enablePersistence({synchronizeTabs:true})}catch(e){toast("오프라인 보관을 시작하지 못했어요. 공유 PC 방식으로 계속합니다.")}}
  const auth=firebase.auth();await auth.setPersistence(window.DG_DEVICE_TRUSTED?"local":"session");
  FB={auth,fs};
  await new Promise(res=>{const un=FB.auth.onAuthStateChanged(()=>{un();res()})});
  try{const r=await FB.auth.getRedirectResult();}catch(e){}
  const u=FB.auth.currentUser;
  if(!u){S.me=null;S.fbSignedOut=true;setSync(false,"로그인 필요");render();return}
  S.me=u.uid;S.fbSignedOut=false;
  // This optional profile write may wait for the server while offline. Start cached reads immediately.

// Downscale a photo. Returns a JPEG data URL; compressBlob returns a Blob too (no data: fetch needed).
async function decodeFile(file){
  if(window.createImageBitmap){try{return await createImageBitmap(file,{imageOrientation:"from-image"})}catch(e){}}
  return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(url);res(img)};img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("decode"))};img.src=url});
}
async function compressBlob(file,max=640,q=.6){
  const img=await decodeFile(file);
  const w=img.width||img.naturalWidth,hh=img.height||img.naturalHeight;
  const r=Math.min(1,max/Math.max(w,hh));const c=document.createElement("canvas");c.width=Math.round(w*r);c.height=Math.round(hh*r);
  c.getContext("2d").drawImage(img,0,0,c.width,c.height);if(img.close)img.close();
  const url=c.toDataURL("image/jpeg",q);
  const blob=await new Promise(res=>c.toBlob(b=>res(b),"image/jpeg",q));
  return{url,blob:blob||null,canvas:c};
}
async function compress(file){return (await compressBlob(file)).url}

function suggestResult(){
  const bad=CHECKS.filter(([k])=>draft.checks[k]==="bad").map(([k])=>k);
  const severe=bad.some(k=>["lamp","leak","pole"].includes(k));
  const r=Object.keys(draft.checks).length===0?null:severe?"고장":bad.length?"점검필요":"정상";
  if(r&&!draft.manual){draft.result=r;document.querySelectorAll("#resSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.res===r))}
  const h=$("#resHint");if(h)h.textContent=severe?"점등·누전·등주 불량은 고장으로 제안돼요.":bad.length?`불량 ${bad.length}개 항목이 있어요.`:"불량 항목을 체크하면 결과가 자동으로 제안돼요.";
}
const INSPECTION_JOBS=new WeakMap(),INSPECTION_BUSY=new Set();
function inspectionDraftKey(d){return JSON.stringify({checks:d.checks,result:d.result,memo:(d.memo||"").trim().slice(0,1000),tilt:d.tilt,photo:d.photo,photos:d.photos||[]})}
function newInspectionJob(l,source){
  const d=JSON.parse(JSON.stringify(source)),now=Date.now();
  const id="insp-"+(globalThis.crypto&&crypto.randomUUID?crypto.randomUUID():now.toString(36)+Math.random().toString(36).slice(2));
  const rec={lightId:l.id,code:l.code,dong:l.dong,date:now,checks:{...d.checks},faults:CHECKS.filter(([k])=>d.checks[k]==="bad").map(([,t])=>t),result:d.result,memo:(d.memo||"").trim().slice(0,1000),inspector:S.me||null};
  if(typeof d.tilt==="number")rec.tiltDeg=d.tilt;
  if(d.pos){rec.pos={lat:+d.pos.lat.toFixed(6),lng:+d.pos.lng.toFixed(6),acc:d.pos.acc||0};if(typeof d.posDist==="number")rec.posDist=d.posDist}
  if(d.photo)rec.photo=d.photo;
  const photos=(d.photos||[]).map((ph,i)=>({id:id+"-p"+i,data:{lightId:l.id,code:l.code,dong:l.dong,inspId:id,label:ph.label,note:ph.note||"",data:ph.data,w:ph.w,h:ph.h,at:now,by:S.me||null,kind:"inspection"},thumb:ph.thumb}));
  if(photos.length){rec.thumbs=photos.map(p=>({id:p.id,label:p.data.label,t:p.thumb}));rec.photoN=photos.length}
  const reps=repSlots(l),fill=[];
  for(const k of ["전경","표찰"]){const ph=photos.find(p=>p.data.label===k);if(!reps[k]&&ph){reps[k]={id:ph.id,at:now,by:S.me||null};fill.push(k)}}
  return{id,rec,photos,reps,fill,key:inspectionDraftKey(d),patch:null};
}
async function inspectionOperations(job,server=false){
  let current;try{current=await lightState(job.rec.lightId,server)}catch(e){if(server)throw e;current=byId(job.rec.lightId)||{}}
  const patch=DGData.latestPatch(current,{status:job.rec.result,lastInspected:job.rec.date,lastResult:job.rec.result,redoNote:null,updatedAt:job.rec.date});
  const currentSlots=repSlots(current),reps={...currentSlots},fill=[];
  for(const slot of job.fill||[]){const target=job.reps[slot];if(!currentSlots[slot]||currentSlots[slot].id===target.id){reps[slot]=target;fill.push(slot)}}
  if(fill.length){const pending=Object.fromEntries(job.photos.map(p=>[p.id,p.data]));Object.assign(patch,await repPatchFor(reps,pending,fill));patch.updatedAt=Math.max(job.rec.date,current.updatedAt||current.lastInspected||0)}
  job.patch=patch;
  return [...job.photos.map(p=>({path:"photos/"+p.id,data:p.data,merge:true})),{path:"inspections/"+job.id,data:job.rec,merge:true},...(Object.keys(patch).length?[{path:"lights/"+job.rec.lightId,data:patch,merge:true}]:[])];
}
async function commitInspectionJob(job){
  async function commit(ops){
    if(FB){const batch=FB.fs.batch();for(const op of ops)batch.set(FB.fs.doc(op.path),op.data,{mergeFields:Object.keys(op.data)});await batch.commit()}
    else if(typeof db.commitMany==="function")await db.commitMany(ops);
    else for(const op of ops){if(op.path.startsWith("lights/"))await patchLight(job.rec.lightId,op.data,job.id+"-light");else{
      const ref=db.doc(op.path),snap=await ref.get(),current=snap&&(typeof snap.data==="function"?snap.data():snap);
      if(current&&snap.exists!==false)await ref.update(op.data);else await ref.set(op.data);
    }}
  }
  try{await commit(await inspectionOperations(job))}catch(e){
    // Rules reject a queued old status once a newer inspection has committed. Preserve the
    // immutable evidence by retrying without that stale state after a server-confirmed read.
    if(!FB||e.code!=="permission-denied")throw e;
    const current=await lightState(job.rec.lightId,true);if(!(current.lastInspected>job.rec.date))throw e;
    await commit(await inspectionOperations(job,true));
  }
  for(const ph of job.photos)GAL[ph.id]={id:ph.id,...ph.data};
}

async function saveInspection(){
  const source=draft;if(!source)return;const l=byId(source.lightId);if(!l)return;
  if(INSPECTION_BUSY.has(l.id)){toast("이 등의 점검 결과를 저장 중이에요.");return}
  let job=INSPECTION_JOBS.get(source);
  if(!job){const done=Object.keys(source.checks).length;
    if(done<CHECKS.length){const left=CHECKS.length-done;if(!confirm(`점검표 ${left}개 항목이 비어 있어요. 나머지를 '양호'로 기록하고 저장할까요?`))return;CHECKS.forEach(([k])=>{if(!source.checks[k])source.checks[k]="ok"});if(!source.result)suggestResult()}
    if(!source.result){toast("점검 결과를 선택해 주세요.");return}
    source.memo=($("#iMemo")||{}).value??source.memo??"";
    job=newInspectionJob(l,source);INSPECTION_JOBS.set(source,job);
  }
  const btn=$("#saveInsp");if(btn){btn.disabled=true;btn.textContent="저장 중…"}
  INSPECTION_BUSY.add(l.id);DRAFTS[l.id]=source;
  const ok=await write(()=>commitInspectionJob(job),job.fill.length?`점검 결과를 저장했어요. ${job.fill.map(k=>"'"+k+"'").join("·")} 사진을 대표 사진으로 넣었어요.`:"점검 결과를 저장했어요.");
  INSPECTION_BUSY.delete(l.id);
  if(ok){INSPECTION_JOBS.delete(source);
    if(draft===source&&$("#iMemo"))source.memo=$("#iMemo").value;
    const unchanged=inspectionDraftKey(source)===job.key;
    if(unchanged&&DRAFTS[l.id]===source)delete DRAFTS[l.id];
    if(draft===source&&unchanged){draft=null;closeSheet()}
    else if(!unchanged)toast("점검 결과를 저장했어요. 이후 수정한 내용은 초안으로 유지돼요.");
    render();
  }
  if(draft===source){const current=$("#saveInsp");if(current){current.disabled=false;current.textContent="점검 결과 저장"}}
}

function fsReady(){const c=window.REPORT_CONFIG;return !!(c&&["gateway","firestore"].includes(c.backend)&&c.firestore&&c.firestore.projectId&&c.firestore.apiKey)}
const SCRIPT_LOADS=new Map();
function loadScript(src){
  if(SCRIPT_LOADS.has(src))return SCRIPT_LOADS.get(src);
  const pending=new Promise((res,rej)=>{const sc=document.createElement("script");sc.src=src;sc.onload=()=>res();sc.onerror=()=>{sc.remove();SCRIPT_LOADS.delete(src);rej(new Error("load "+src))};document.head.appendChild(sc)});
  SCRIPT_LOADS.set(src,pending);return pending;
}
async function fsApp(){
  const c=window.REPORT_CONFIG.firestore;const V="10.12.2";
  if(FB&&FB.auth.currentUser){if((window.FIREBASE_CONFIG||{}).projectId!==c.projectId)throw new Error("직원 저장소와 신고 저장소의 프로젝트가 달라요. 같은 프로젝트 설정을 확인해 주세요.");return FB.fs;}
  for(const m of ["app","auth","firestore"])await loadScript(`https://www.gstatic.com/firebasejs/${V}/firebase-${m}-compat.js`);
  if(!firebase.apps.length)firebase.initializeApp({apiKey:c.apiKey,authDomain:c.authDomain||`${c.projectId}.firebaseapp.com`,projectId:c.projectId});
  if(firebase.app().options.projectId!==c.projectId)throw new Error("현재 로그인한 저장소와 신고 프로젝트 설정이 달라요.");
  await firebase.auth().setPersistence("session");
  if(!firebase.auth().currentUser){const prov=new firebase.auth.GoogleAuthProvider();try{await firebase.auth().signInWithPopup(prov)}catch(e){if(e&&/popup/.test(e.code||""))await firebase.auth().signInWithRedirect(prov);else throw e}}
  return firebase.firestore();
}

          await fs.runTransaction(async tx=>{const [raw,current]=await Promise.all([tx.get(rawRef),tx.get(target)]);if(!raw.exists)throw new Error("원본 신고가 삭제됐어요.");exists=current.exists;
            if(raw.data().imported===true){if(exists&&current.data().ext===sourceId)return;throw new Error("이미 다른 신고로 연결된 원본이에요. 연결 내용을 확인하세요.")}

const REP={period:"month",from:"",to:"",dong:"전체",photos:true,inlinePh:true,data:null,loading:false,err:""};
function repRange(){const now=new Date();let a,b=now.getTime();
  if(REP.period==="month"){a=new Date(now.getFullYear(),now.getMonth(),1).getTime()}
  else if(REP.period==="last"){a=new Date(now.getFullYear(),now.getMonth()-1,1).getTime();b=new Date(now.getFullYear(),now.getMonth(),1).getTime()-1}
  else if(REP.period==="7"){a=b-7*86400000}
  else if(REP.period==="30"){a=b-30*86400000}

    });}else{

/* ---------- 대표 사진: up to three reference photos per light (전경·표찰·주변). Each is a "photos" doc; the light record keeps

function thumbOf(src,max,q){const w=src.width||src.naturalWidth,h=src.height||src.naturalHeight;const r=Math.min(1,max/Math.max(w,h));const c=document.createElement("canvas");c.width=Math.max(1,Math.round(w*r));c.height=Math.max(1,Math.round(h*r));c.getContext("2d").drawImage(src,0,0,c.width,c.height);return c.toDataURL("image/jpeg",q)}

function posCheckStart(id){

  if(!navigator.geolocation){const t=$("#posTxt");if(t)t.textContent="이 기기에서는 위치를 쓸 수 없어요";return}
  const onPos=p=>{if(PK.id!==id)return;const pos={lat:p.coords.latitude,lng:p.coords.longitude,acc:Math.round(p.coords.accuracy||0)};
    if(PK.pos&&pos.acc>PK.pos.acc&&Date.now()-PK.t<8000)return; // keep the better fix while it settles

async function saveLightEdit(id,btn){
  const l=byId(id);if(!l)return;
  const v={lampType:$("#leLamp").value,pole:$("#lePole").value,sw:$("#leSw").value,poleNo:$("#lePoleNo").value.trim(),replacedYear:$("#leYear").value?+$("#leYear").value:"",removed:$("#leRemoved").checked,note:$("#leNote").value.trim()};

  if($("#leLat").value||$("#leLng").value){if(!(la>33&&la<39&&ln>124&&ln<132)){toast("좌표가 한국 범위를 벗어났어요. 위도·경도를 확인하세요.");return}v.lat=+la.toFixed(6);v.lng=+ln.toFixed(6)}
  const changes=[];const patch={};
  for(const f of Object.keys(v)){
    const cur=f==="removed"?!!l.removed:(l[f]??"");const nv=v[f];
    const same=f==="lat"||f==="lng"?(typeof cur==="number"&&Math.abs(cur-nv)<0.0000015):String(cur)===String(nv);
    if(same)continue;changes.push({f,from:f==="removed"?cur:(cur===""?null:cur),to:f==="removed"?nv:(nv===""?null:nv)});patch[f]=f==="removed"?nv:(nv===""?null:nv);
  }

  if(patch.removed===true)patch.removedAt=Date.now();
  const entry={at:Date.now(),by:S.me||null,changes};
  patch.edits=[...(l.edits||[]).slice(-29),entry];patch.updatedAt=entry.at;
  btn.disabled=true;btn.textContent="저장 중…";
  const ok=await write(()=>patchLight(id,patch),`${l.code} 정보를 고쳤어요 (${changes.map(c=>EDIT_FIELDS[c.f]).join(", ")}).`);
  if(ok)openLight(id);else{btn.disabled=false;btn.textContent="변경 내용 저장"}
}

/* ---------- pole tilt (phone against the pole) ---------- */
const TILT_WARN=2;
let tilt={on:false,val:null,buf:[],run:0};
async function startTilt(){
  const box=$("#tiltBox");if(!box)return;
  stopTilt();const run=tilt.run,owner=draft,current=()=>tilt.run===run&&draft===owner&&$("#tiltBox")===box;
  if(!window.DeviceOrientationEvent){box.hidden=false;box.innerHTML=`<p class="muted">이 기기에서는 기울기 센서를 쓸 수 없어요.</p>`;return}
  if(typeof DeviceOrientationEvent.requestPermission==="function"){
    try{const r=await DeviceOrientationEvent.requestPermission();if(!current())return;if(r!=="granted"){box.hidden=false;box.innerHTML=`<p class="muted">동작 센서 권한이 없어 측정할 수 없어요.</p>`;return}}
    catch(e){if(current()){box.hidden=false;box.innerHTML=`<p class="muted">동작 센서 권한이 없어 측정할 수 없어요.</p>`}return}
  }
  if(!current())return;
  const so=screen.orientation?.angle||0;
  tilt={on:true,val:null,buf:[],run,owner,zero:null,stable:false,axis:DongguField.longAxis(screen.width,screen.height,so)};
  box.hidden=false;
  box.innerHTML=`<div class="tiltbox"><p class="muted" style="margin:4px 0">먼저 수직이 확인된 기준면에 휴대폰 긴 모서리를 세워 영점을 맞추세요. 같은 모서리를 등주에 붙이고 흔들림이 멈추면 기록하세요. 화면 회전과 관계없이 기기의 긴 축을 측정해요.</p>
    <div class="tilt-n" id="tiltN">–</div><div id="tiltQuality" role="status" aria-live="polite">센서를 기다리는 중…</div><p class="muted">휴대폰 참고값이에요. ${TILT_WARN}° 이상이면 수직 검측기로 재확인하고 등주 상태를 직접 선택하세요.</p>
    <div class="bubble"><i id="tiltDot"></i></div>
    <div class="split" style="justify-content:center"><button class="btn ghost sm" id="tiltZero" disabled>수직 기준으로 영점</button><button class="btn sm" id="tiltKeep" disabled>참고값 기록</button><button class="btn ghost sm" id="tiltStop">닫기</button></div></div>`;
  window.addEventListener("deviceorientation",onTilt);
}
function onTilt(e){
  if(!tilt.on)return;const v=DongguField.gravityVector(e.beta,e.gamma);if(!v)return;
  const now=performance.now();tilt.buf.push({v,at:now});tilt.buf=tilt.buf.filter(s=>now-s.at<=1500).slice(-120);
  const q=DongguField.tiltWindow(tilt.buf,tilt.zero,tilt.axis);tilt.val=q.value;tilt.stable=q.stable;tilt.vector=q.vector;tilt.spread=q.spread;
  tilt.raw=DongguField.longAxisTilt(e.beta,e.gamma,tilt.axis);
  const n=$("#tiltN"),d=$("#tiltDot");if(!n)return;
  n.textContent=q.value.toFixed(1)+"°";n.style.color=q.value>=TILT_WARN?"var(--warn)":"var(--ink)";
  const status=$("#tiltQuality");const txt=!tilt.zero?(q.stable?"안정됨 · 수직 기준면에서 영점을 맞추세요":"영점 준비 · 움직임을 멈춰 주세요"):(q.stable?`안정됨 · 흔들림 범위 ${q.spread.toFixed(1)}°` : "측정 중 · 1초 이상 움직임을 멈춰 주세요");if(status&&status.textContent!==txt)status.textContent=txt;
  $("#tiltZero").disabled=!q.stable||tilt.raw>10;$("#tiltKeep").disabled=!q.stable||!tilt.zero;
  if(d)d.style.left=`calc(50% - 5px + ${Math.min(60,q.value*4)}px)`;
}
function zeroTilt(){
  if(!tilt.stable||!tilt.vector||tilt.raw>10){toast("수직이 확인된 기준면에 세우고 잠시 기다리세요.");return}
  tilt.zero=tilt.vector.slice();tilt.buf=[];tilt.stable=false;tilt.val=null;$("#tiltKeep").disabled=true;
  toast("영점을 맞췄어요. 같은 모서리를 등주에 붙여 측정하세요.");
}
function keepTilt(){
  if(tilt.val==null||!draft||draft!==tilt.owner||!tilt.zero||!tilt.stable){toast("영점을 맞춘 뒤 흔들림이 멈출 때까지 기다리세요.");return}
  draft.tilt=Math.round(tilt.val*10)/10;
  const m=$("#iMemo");if(m)m.value=(m.value?m.value+"\n":"")+`등주 기울기 참고값 ${draft.tilt.toFixed(1)}° (휴대폰 영점 보정·안정 확인, 흔들림 ${tilt.spread.toFixed(1)}°)`;
  toast(`${draft.tilt.toFixed(1)}° 참고값을 기록했어요.${draft.tilt>=TILT_WARN?" 수직 검측기로 재확인하고 등주 상태를 선택하세요.":""}`);
  stopTilt();
}
function stopTilt(){tilt.on=false;tilt.run=(tilt.run||0)+1;window.removeEventListener("deviceorientation",onTilt);const b=$("#tiltBox");if(b){b.hidden=true;b.innerHTML=""}}

/* ---------- brightness estimate & gap review ----------
   A model, not a measurement: each light gets an effective radius from its kind and lamp type (a 9m 가로등 pole
   lights farther than a 5m 보안등 on a KEPCO pole), broken lights count as dark, and the midpoint between every pair

1) 가로등 표찰(초록색 머리띠에 "가로등", 왼쪽에 파란 세로 띠 "관리번호"): 도로명(예: 지호로)과 그 아래 큰 숫자 "번호-가지번호"(예: 65-5)가 있습니다. 도로명이 없는 옛 표찰은 숫자만(예: 140-8) 있습니다. 이때 kind="가로등", road="지호로"(없으면 null), num="65-5".
2) 보안등 표찰(파란색, "보안등 고장신고"): 동 이름(${DONGS.join(", ")} 중 하나)과 그 아래 큰 숫자가 있습니다. 예: 산수동 642, 충장로5가 030. 이때 kind="보안등", dong="산수동", num="642".
표찰의 전화번호(608-xxxx 등)는 번호가 아니니 무시하세요. 현수막·광고의 숫자도 무시하세요.
3) 한국전력 전주번호판(흰색, "위험"): 숫자4자리+영문1자+숫자3자리 형식(예: 9792C742) → pole.
반드시 아래 JSON 하나만 출력하세요. 못 읽은 항목은 null로 두세요.
{"kind": "가로등"|"보안등"|null, "dong": string|null, "road": string|null, "num": string|null, "pole": string|null, "confidence": "high"|"low"}`,{images:imgs,modelTier:"quick"}));
    const dn=out&&typeof out.dong==="string"?out.dong.replace(/\s/g,""):"";
    const dong=DONGS.find(d=>d===dn)||DONGS_M.find(d=>dn&&d.length>=3&&!/가$/.test(d)&&dn.startsWith(d.replace(/동$/,"")));
    const numRaw=out&&out.num?String(out.num).trim():"";
    const pole=parsePole(out&&out.pole||"");
    let code=null;
    const g=numRaw.match(/^(\d{1,4})\s*-\s*(\d{1,3})$/);
    const road=out&&typeof out.road==="string"?out.road.replace(/\s/g,""):"";
    if(g&&out.kind!=="보안등")code={kind:"가로등",road,main:g[1],sub:g[2]};
    else{const n=numRaw.replace(/\D/g,"");if(dong&&n)code={kind:"보안등",dong,num:n};else if(g)code={kind:"가로등",road,main:g[1],sub:g[2]}}
    const kind=code?code.kind:(out&&out.kind||"보안등");
    stageStatus(code?"읽었어요. 아래에서 확인하세요.":"번호를 읽지 못했어요.",false);
    showScanResult({code,pole,kind,how:"photo",plate:plateUrl,raw:code?"":`인식 결과: ${JSON.stringify(out)}`,pick:{kind,num:code?(code.kind==="가로등"?`${code.main}-${code.sub}`:code.num):numRaw,dong:dong||"",road:road||"",auto:!!plateBox}});
    if(out&&out.confidence==="low"&&code)toast("표찰이 흐려 번호가 틀릴 수 있어요. 확인해 주세요.");
  }catch(e){
    if(!job.current())return;
    const code=e&&e.code;
    const msg=code==="not_granted"?"사진 인식에 동의하지 않아 번호를 읽지 못했어요. 아래에서 직접 입력해 주세요.":code==="rate_limited"?"요청이 많아요. 잠시 후 다시 시도해 주세요.":code==="image_rejected"||code==="images_unavailable"?"이 사진 형식은 보낼 수 없어요. 카메라로 바로 찍은 JPG로 다시 시도해 주세요.":`사진에서 표찰을 읽지 못했어요. 더 가까이서 다시 찍어 주세요.${code?` (${code})`:""}`;
    stageStatus("",false);
    showScanResult({code:null,raw:msg,how:"photo",pick:{kind:"보안등",num:"",dong:"",road:""}});
  }finally{job.finish()}
}
document.addEventListener("change",e=>{if(e.target.id==="scanPhoto"||e.target.id==="scanPhotoLib"){const f=e.target.files&&e.target.files[0];if(f)readLabelPhoto(f)}});
const _close=closeSheet;closeSheet=function(fromHistory){S.asec=null;repConfirmClose();posCheckStop();cancelScanPhoto();scan.active=false;stopCam(false);stopTilt();arStop();if(pt.on&&!$("#ptSumm")){ptReset()}if(gmap){meStop();gmap.remove();gmap=null;gmapMe=null;gmapPts=[]}_close(fromHistory)};

initializeOperations();
render();
try{if(localStorage.getItem("dg-near")==="1"){S.near=false;nearToggle()}}catch(e){}
boot().then(async()=>{await DGIntegration.ready();idbGet("roads").then(r=>{if(r&&r.ver===ROADS_VER&&r.ways&&r.ways.length){ROADS=r;adongIndex();render()}})}).catch(e=>toast("앱 초기화를 마치지 못했어요: "+e.message));
</script>
