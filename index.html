<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>광주 동구 가로등 점검</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<style>
:root{
  --ink:#16233D; --ink-2:#4A5873; --line:#D8DEE8; --bg:#EEF1F5; --card:#FFFFFF;
  --sodium:#E89A0C; --sodium-soft:#FFF1D6; --ok:#2C7A57; --ok-soft:#E1F2EA;
  --warn:#B86E00; --warn-soft:#FFF0D9; --bad:#C2372B; --bad-soft:#FBE4E1;
  --fix:#2F5DA8; --fix-soft:#E2EAF7;
  --font:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#E8ECF3; --ink-2:#A3AEC2; --line:#2C3850; --bg:#0F1726; --card:#17223A;
    --sodium:#F5B03A; --sodium-soft:#3A2E14; --ok:#5CC495; --ok-soft:#173528;
    --warn:#F0A945; --warn-soft:#3A2A10; --bad:#F07A6E; --bad-soft:#3D1B19;
    --fix:#7FA6E8; --fix-soft:#1A2A47;
  }
}
:root[data-theme="dark"]{
  --ink:#E8ECF3; --ink-2:#A3AEC2; --line:#2C3850; --bg:#0F1726; --card:#17223A;
  --sodium:#F5B03A; --sodium-soft:#3A2E14; --ok:#5CC495; --ok-soft:#173528;
  --warn:#F0A945; --warn-soft:#3A2A10; --bad:#F07A6E; --bad-soft:#3D1B19;
  --fix:#7FA6E8; --fix-soft:#1A2A47;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sodium);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 110px}

/* header: the lamp head is the one bold element */
header.top{padding:22px 0 14px;display:flex;align-items:flex-end;gap:14px}
.lamp{width:46px;height:58px;flex:none}
.lamp .glow{fill:var(--sodium)}
header h1{font-size:22px;line-height:1.25;margin:0;font-weight:700;letter-spacing:-.01em}
header p{margin:2px 0 0;color:var(--ink-2);font-size:13px}
.sync{margin-left:auto;font-size:12px;color:var(--ink-2);white-space:nowrap}
.sync i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin-right:5px;vertical-align:1px}
.sync.on i{background:var(--ok)}

.tally{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 18px}
.tally button{border:0;border-radius:10px;padding:10px 8px 8px;text-align:left;background:var(--card);border-top:4px solid var(--c)}
.tally b{display:block;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.tally span{font-size:12px;color:var(--ink-2)}
.tally button[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--c)}

h2{font-size:17px;margin:22px 0 10px;font-weight:700}
h3{font-size:15px;margin:0 0 6px}
.muted{color:var(--ink-2);font-size:13px}
.panel{background:var(--card);border-radius:12px;padding:14px;border:1px solid var(--line)}

.tools{display:flex;gap:8px;margin-bottom:10px}
.tools input,.tools select{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
.tools select{flex:0 0 auto;max-width:32%}
.tools .btn.sm{white-space:nowrap;flex:none}

.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;text-align:left;width:100%}
.row .code{font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.row .addr{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .meta{margin-left:auto;text-align:right;flex:none}
.row .body{min-width:0;flex:1}
.pole{width:6px;align-self:stretch;border-radius:3px;background:var(--c);flex:none}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--cs);color:var(--c);white-space:nowrap}
.due{display:block;font-size:11px;color:var(--warn);margin-top:3px}

.st-정상{--c:var(--ok);--cs:var(--ok-soft)}
.st-점검필요{--c:var(--warn);--cs:var(--warn-soft)}
.st-고장{--c:var(--bad);--cs:var(--bad-soft)}
.st-수리중{--c:var(--fix);--cs:var(--fix-soft)}
.st-접수{--c:var(--bad);--cs:var(--bad-soft)}
.st-처리중{--c:var(--fix);--cs:var(--fix-soft)}
.st-완료{--c:var(--ok);--cs:var(--ok-soft)}

/* forms */
label.f{display:block;margin:12px 0 4px;font-size:13px;font-weight:600}
.f-in{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
textarea.f-in{min-height:84px;resize:vertical}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:600;background:var(--ink);color:var(--bg)}
.btn.sodium{background:var(--sodium);color:#1B1300}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.check{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check .q{flex:1}
.check .q small{display:block;color:var(--ink-2);font-size:12px}
.pair{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.pair button{border:0;background:var(--card);padding:8px 13px;font-size:13px;font-weight:600}
.pair button.g[aria-pressed="true"]{background:var(--ok);color:#fff}
.pair button.b[aria-pressed="true"]{background:var(--bad);color:#fff}

.photo-in{display:flex;gap:10px;align-items:center}
.photo-in img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.thumb{max-width:100%;border-radius:8px;margin-top:8px;display:block}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(10,16,30,.45);z-index:30;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--bg);border-radius:16px 16px 0 0;max-height:92%;overflow:auto;display:none;padding:0 0 env(safe-area-inset-bottom,0px)}
.sheet.open,.sheet-bg.open{display:block}
.sheet-in{max-width:760px;margin:0 auto;padding:10px 16px 28px}
.sheet .grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
.sheet-head .x{margin-left:auto;border:0;background:transparent;font-size:24px;line-height:1;padding:2px 6px;color:var(--ink-2)}

/* map */
.map{width:100%;height:auto;display:block}
.map .dong{font-size:9px;fill:var(--ink-2);font-family:var(--font)}
.map circle{cursor:pointer;stroke:var(--card);stroke-width:1.2}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--ink-2);margin-top:6px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:5px}

.bars .b{display:grid;grid-template-columns:62px 1fr 34px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.bars .track{height:10px;border-radius:5px;background:var(--bg);overflow:hidden;display:flex}
.bars .track span{display:block;height:100%;background:var(--c)}

.split{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.empty{padding:22px 14px;text-align:center;color:var(--ink-2);background:var(--card);border:1px dashed var(--line);border-radius:10px;font-size:14px}
.notice{background:var(--sodium-soft);border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{border:0;background:transparent;padding:10px 4px 12px;font-size:13px;font-weight:600;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--ink)}
nav.tabs button[aria-selected="true"] svg{color:var(--sodium)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:50;display:none;max-width:90%}
.toast.show{display:block}
.ov{position:absolute;left:10px;right:10px;top:10px;background:rgba(16,24,40,.82);color:#fff;border-radius:12px;padding:10px 12px;backdrop-filter:blur(4px);border-left:5px solid var(--c);display:none}
.ov.show{display:block}
.ov b{font-size:20px}.ov .muted{color:#C9D2E3}.ov .chip{background:var(--c);color:#fff}
.ov .split .btn{background:#fff;color:#16233D}.ov .split .btn.ghost{background:transparent;color:#fff;border-color:#fff8}
.arwrap{position:relative;background:#000;border-radius:12px;overflow:hidden;height:60vh;min-height:360px}
.arwrap video{width:100%;height:100%;object-fit:cover;display:block}
.arwrap .fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#C9D2E3;font-size:13px;text-align:center;padding:20px;background:linear-gradient(#1A2538,#0F1726)}
.arwrap.nocam .fallback{display:flex}
.arm{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:2px;transition:left .15s,top .15s;cursor:pointer;border:0;background:transparent;padding:0}
.arm .tag{background:rgba(16,24,40,.85);color:#fff;border-radius:10px;padding:5px 9px;font-size:12px;line-height:1.3;white-space:nowrap;border:2px solid var(--c);text-align:center}
.arm .tag b{display:block;font-size:13px}
.arm .pin{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid var(--c)}
.arm.far .tag{opacity:.7;transform:scale(.88)}
.aredge{position:absolute;top:46%;color:#fff;font-size:12px;background:rgba(16,24,40,.75);border-radius:99px;padding:5px 9px;border:0;cursor:pointer}
.aredge.l{left:8px}.aredge.r{right:8px}
.arhud{position:absolute;left:0;right:0;top:0;padding:8px 10px;display:flex;justify-content:space-between;color:#fff;font-size:12px;background:linear-gradient(rgba(0,0,0,.55),transparent);pointer-events:none}
.radar{position:absolute;right:10px;bottom:10px;width:92px;height:92px;border-radius:50%;background:rgba(16,24,40,.72);border:1px solid #fff5;pointer-events:none}
.radar::before{content:"";position:absolute;left:50%;top:50%;width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-bottom:40px solid rgba(255,255,255,.12);transform:translate(-50%,-100%)}
.radar i{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--c);transform:translate(-50%,-50%)}
.radar .me{width:6px;height:6px;background:#fff;left:50%;top:50%}
.arlist .row{padding:8px 12px}
.reticle{position:absolute;left:50%;top:50%;width:150px;height:150px;transform:translate(-50%,-50%);border:2px solid #fff9;border-radius:14px;pointer-events:none}
.tiltbox{text-align:center;padding:10px 0}
.tilt-n{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.bubble{width:140px;height:14px;border-radius:7px;background:var(--bg);margin:10px auto 4px;position:relative;overflow:hidden}
.bubble i{position:absolute;top:2px;width:10px;height:10px;border-radius:50%;background:var(--sodium);left:calc(50% - 5px);transition:left .1s}
.hist{border-left:3px solid var(--c);padding:4px 0 4px 10px;margin:8px 0}
@media (max-width:420px){.tally b{font-size:20px}}
@media (prefers-reduced-motion:no-preference){.sheet.open{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <svg class="lamp" viewBox="0 0 46 58" aria-hidden="true">
      <path d="M8 58V14c0-6 4-10 10-10h14" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M26 2h16a3 3 0 0 1 3 3v3H23V5a3 3 0 0 1 3-3z" fill="currentColor"/>
      <path class="glow" d="M24 9h20l-3 6H27z"/>
      <path d="M34 15l-9 30h18z" fill="var(--sodium)" opacity=".18"/>
    </svg>
    <div>
      <h1>광주 동구 가로등 점검</h1>
      <p>현장 점검, 고장 관리, 주민 신고를 한곳에서</p>
    </div>
    <div class="sync" id="sync"><i></i><span>연결 중</span></div>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs" role="tablist" aria-label="화면 선택"><div class="in">
  <button role="tab" data-tab="inspect" aria-selected="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6v3H9zM7 5H5v16h14V5h-2"/><path d="m9 14 2 2 4-4"/></svg>현장 점검</button>
  <button role="tab" data-tab="admin" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>관리 현황</button>
  <button role="tab" data-tab="report" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0-6 6c0 4.5 6 12 6 12s6-7.5 6-12a6 6 0 0 0-6-6z"/><path d="M12 7v3M12 13h.01"/></svg>주민 신고</button>
</div></nav>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="sheet-in" id="sheetIn"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
const DONGS=["충장동","동명동","계림동","산수동","지산동","서남동","학동","학운동","지원동","화순읍"];
const SLUG={"충장동":"cj","동명동":"dm","계림동":"gr","산수동":"ss","지산동":"js","서남동":"sn","학동":"hd","학운동":"hu","지원동":"jw","화순읍":"hs"};
const KINDS=["가로등","보안등"];
const codeOf=(dong,num)=>`${dong} ${num}`;
const idOf=(dong,num)=>`${SLUG[dong]}-${num}`;
function parseCode(text){
  if(!text)return null;const t=String(text).replace(/\s+/g," ");
  for(const d of DONGS){const m=t.match(new RegExp(d.replace("동","\\s*동")+"\\s*(\\d{1,5})"));if(m)return{dong:d,num:m[1]}}
  const u=t.match(/(?:no|num|id|code|lamp)=([^&\s]+)/i);if(u){const p=parseCode(decodeURIComponent(u[1]));if(p)return p}
  return null;
}
function parsePole(text){const m=String(text||"").replace(/\s+/g,"").match(/\d{4}[A-Z]\d{3}/);return m?m[0]:null}
const LSTAT=["정상","점검필요","고장","수리중"];
const RSTAT=["접수","처리중","완료"];
const ISSUES=["불이 꺼져 있어요","깜빡거려요","낮에도 켜져 있어요","등이 파손됐어요","기둥이 기울었어요","전선이 노출됐어요","기타"];
const CHECKS=[
  ["lamp","점등 상태","야간 점등 또는 점등 시험"],
  ["flicker","깜빡임·조도","밝기 저하, 깜빡임 여부"],
  ["fixture","등기구","커버 파손, 이물질, 누수"],
  ["pole","등주","기울기, 부식, 도장 상태"],
  ["base","기초·볼트","기초 균열, 볼트 풀림"],
  ["cabinet","분전함·안정기","잠금, 결선, 발열"],
  ["leak","누전","절연저항·누설전류 측정"],
  ["tree","주변 간섭","수목, 간판, 시야 가림"]
];
const DUE_DAYS=90;

const S={lights:[],insp:[],reports:[],tab:"inspect",q:"",dong:"전체",stat:null,me:null,canWrite:true,live:false,names:{}};
let db=null,user=null,dl=null;
const $=s=>document.querySelector(s);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtD=t=>{if(!t)return"기록 없음";const d=new Date(t);return`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`};
const fmtDT=t=>{if(!t)return"";const d=new Date(t);return fmtD(t)+` ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`};
const isDue=l=>!l.lastInspected||(Date.now()-l.lastInspected)>DUE_DAYS*864e5;
const byId=id=>S.lights.find(l=>l.id===id);
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2600)}

/* ---------- data ---------- */
/* Local fallback store (GitHub Pages / plain hosting): same API surface as the shared db,
   backed by this browser's localStorage, seeded from seed/manifest.json. Not shared between devices. */
function localDb(){
  const KEY="donggu-streetlight-local";let data={lights:{},inspections:{},reports:{}};const subs=[];
  try{const s=localStorage.getItem(KEY);if(s)data=JSON.parse(s)}catch(e){}
  const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}subs.forEach(f=>f())};
  const snapOf=(col,q)=>{let rows=Object.entries(data[col]||{}).map(([id,d])=>({id,data:()=>d}));
    if(q.where)rows=rows.filter(r=>r.data()[q.where[0]]===q.where[2]);
    if(q.order)rows.sort((x,y)=>{const a=x.data()[q.order[0]]||0,b=y.data()[q.order[0]]||0;return q.order[1]==="desc"?b-a:a-b});
    if(q.lim)rows=rows.slice(0,q.lim);return{docs:rows}};
  const query=(col,q={})=>({
    where:(f,op,v)=>query(col,{...q,where:[f,op,v]}),orderBy:(f,d)=>query(col,{...q,order:[f,d]}),limit:n=>query(col,{...q,lim:n}),
    get:async()=>snapOf(col,q),
    onSnapshot:cb=>{const f=()=>cb(snapOf(col,q));subs.push(f);f();return()=>{const i=subs.indexOf(f);if(i>=0)subs.splice(i,1)}},
    add:async rec=>{const id="l"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);(data[col]=data[col]||{})[id]=rec;save();return{id}}
  });
  const seed=async()=>{
    if(Object.keys(data.lights).length)return;
    try{const m=await (await fetch("seed/manifest.json")).json();
      await Promise.all(m.map(async e=>{const d=await (await fetch("seed/"+e.file)).json();(data[e.collection]=data[e.collection]||{})[e.doc_id]=d}));save()}catch(e){}
  };
  return{seed,collection:c=>query(c),doc:path=>{const [c,id]=path.split("/");return{
    set:async rec=>{(data[c]=data[c]||{})[id]=rec;save()},
    update:async patch=>{data[c][id]=Object.assign(data[c][id]||{},patch);save()}}}};
}
async function boot(){
  if(!window.claude||!window.claude.use){
    db=localDb();S.me="local";setSync(false,"이 기기에만 저장");
    const o=$("#sync");o.title="공유 서버 없이 이 브라우저에만 저장되는 체험 모드예요.";
    await db.seed();
    const sub=(q,key)=>q.onSnapshot(snap=>{S[key]=snap.docs.map(d=>({id:d.id,...d.data()}));S.live=true;render()});
    sub(db.collection("lights"),"lights");
    sub(db.collection("inspections").orderBy("date","desc").limit(40),"insp");
    sub(db.collection("reports").orderBy("createdAt","desc").limit(100),"reports");
    dl={save:async({filename,data})=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"text/csv"}));a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2e3)}};
    return;
  }
  try{
    [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    claude.use("downloads").then(d=>{dl=d;if(S.tab==="admin")render()});
  }catch(e){}
  if(!db){setSync(false,"저장 불가");render();return}
  if(user){
    try{S.me=await user.id()}catch(e){}
    try{const c=await user.can("data.write");if(c===false)S.canWrite=false}catch(e){}
  }
  const sub=(q,key,map)=>q.onSnapshot(snap=>{S[key]=snap.docs.map(d=>({id:d.id,...d.data()}));if(map)map();S.live=true;setSync(true,"실시간");render();resolveNames()},err=>{setSync(false,"연결 끊김")});
  sub(db.collection("lights"),"lights");
  sub(db.collection("inspections").orderBy("date","desc").limit(40),"insp");
  sub(db.collection("reports").orderBy("createdAt","desc").limit(100),"reports");
}

async function resolveNames(){

  try{const ps=await user.profiles(ids);ids.forEach(id=>S.names[id]=(ps[id]&&ps[id].name)||"점검자");render()}catch(e){}
}
async function write(fn,okMsg){

    render();return false;

function compress(file){
  return new Promise((res,rej)=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{const m=640,r=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL("image/jpeg",.6))};
    img.onerror=()=>{URL.revokeObjectURL(url);rej()};img.src=url;
  });
}

function mapSVG(){
  const pts=S.lights.filter(l=>typeof l.lat==="number"&&typeof l.lng==="number");
  if(!pts.length)return `<div class="empty">위치 정보가 있는 가로등이 없어요.</div>`;
  const W=340,H=250,p=18;
  let a=Math.min(...pts.map(l=>l.lat)),b=Math.max(...pts.map(l=>l.lat)),c=Math.min(...pts.map(l=>l.lng)),d=Math.max(...pts.map(l=>l.lng));
  if(b-a<.004){a-=.002;b+=.002} if(d-c<.004){c-=.002;d+=.002}
  const x=g=>p+(g-c)/(d-c)*(W-2*p),y=t=>p+(b-t)/(b-a)*(H-2*p);
  const groups={};pts.forEach(l=>{(groups[l.dong]=groups[l.dong]||[]).push(l)});
  const labels=Object.entries(groups).map(([k,v])=>{const mx=v.reduce((s,l)=>s+x(l.lng),0)/v.length,my=v.reduce((s,l)=>s+y(l.lat),0)/v.length;return `<text class="dong" x="${mx.toFixed(1)}" y="${(my-9).toFixed(1)}" text-anchor="middle">${esc(k)}</text>`}).join("");
  const col={"정상":"var(--ok)","점검필요":"var(--warn)","고장":"var(--bad)","수리중":"var(--fix)"};
  const order=[...pts].sort((m,n)=>(m.status==="정상")-(n.status==="정상")).reverse();
  return `<svg class="map" viewBox="0 0 ${W} ${H}" role="img" aria-label="동구 가로등 위치 분포">
    <rect x="1" y="1" width="${W-2}" height="${H-2}" rx="10" fill="var(--bg)"/>
    ${labels}
    ${order.map(l=>`<circle data-light="${esc(l.id)}" cx="${x(l.lng).toFixed(1)}" cy="${y(l.lat).toFixed(1)}" r="${l.status==="정상"?4:5.5}" fill="${col[l.status]||"var(--ink-2)"}"><title>${esc(l.code)} ${esc(l.status)}</title></circle>`).join("")}
  </svg>
  <div class="legend">${LSTAT.map(s=>`<span class="st-${s}"><i></i>${s}</span>`).join("")}</div>`;
}
function dongBars(){

  const max=Math.max(1,...rows.map(r=>r.n));
  return `<div class="bars">${rows.map(r=>`<div class="b"><span>${r.d}</span><span class="track" style="width:${(r.n/max*100).toFixed(0)}%">${r.c.map((k,i)=>k?`<span class="st-${LSTAT[i]}" style="width:${(k/r.n*100).toFixed(1)}%"></span>`:"").join("")}</span><span class="muted">${r.n}</span></div>`).join("")}</div>`;

function suggestResult(){

/* ---------- pole tilt (phone against the pole) ---------- */
const TILT_WARN=2;
let tilt={on:false,val:null,buf:[]};
async function startTilt(){
  const box=$("#tiltBox");if(!box)return;
  if(!window.DeviceOrientationEvent){box.hidden=false;box.innerHTML=`<p class="muted">이 기기에서는 기울기 센서를 쓸 수 없어요.</p>`;return}
  if(typeof DeviceOrientationEvent.requestPermission==="function"){
    try{const r=await DeviceOrientationEvent.requestPermission();if(r!=="granted"){box.hidden=false;box.innerHTML=`<p class="muted">동작 센서 권한이 없어 측정할 수 없어요.</p>`;return}}
    catch(e){box.hidden=false;box.innerHTML=`<p class="muted">동작 센서 권한이 없어 측정할 수 없어요.</p>`;return}
  }
  tilt={on:true,val:null,buf:[]};
  box.hidden=false;
  box.innerHTML=`<div class="tiltbox"><p class="muted" style="margin:4px 0">휴대폰 긴 면을 등주에 세로로 붙이고 잠시 기다리세요</p>
    <div class="tilt-n" id="tiltN">–</div><div class="muted">수직 기준 기울기 · ${TILT_WARN}° 이상이면 불량 권장</div>
    <div class="bubble"><i id="tiltDot"></i></div>
    <div class="split" style="justify-content:center"><button class="btn sm" id="tiltKeep">이 값으로 기록</button><button class="btn ghost sm" id="tiltStop">닫기</button></div></div>`;
  window.addEventListener("deviceorientation",onTilt);
}
function onTilt(e){
  if(!tilt.on||e.beta==null||e.gamma==null)return;
  const b=e.beta*Math.PI/180,g=e.gamma*Math.PI/180;
  // angle between the phone's long axis and gravity, when held upright in portrait
  const cosT=Math.abs(Math.sin(b)*Math.cos(g));
  const deg=Math.acos(Math.min(1,Math.max(-1,cosT)))*180/Math.PI;
  tilt.buf.push(deg);if(tilt.buf.length>12)tilt.buf.shift();
  const avg=tilt.buf.reduce((s,x)=>s+x,0)/tilt.buf.length;tilt.val=avg;
  const n=$("#tiltN"),d=$("#tiltDot");if(!n)return;
  n.textContent=avg.toFixed(1)+"°";n.style.color=avg>=TILT_WARN?"var(--bad)":"var(--ok)";
  if(d)d.style.left=`calc(50% - 5px + ${Math.max(-60,Math.min(60,(90-e.beta)*4))}px)`;
}
function keepTilt(){
  if(tilt.val==null||!draft){toast("아직 값이 안 잡혔어요. 잠시 더 대 주세요.");return}
  draft.tilt=Math.round(tilt.val*10)/10;
  const m=$("#iMemo");if(m&&!/기울기/.test(m.value))m.value=(m.value?m.value+"\n":"")+`등주 기울기 ${draft.tilt.toFixed(1)}°`;
  if(draft.tilt>=TILT_WARN){draft.checks.pole="bad";document.querySelectorAll('#checks [data-ck="pole"]').forEach(x=>x.setAttribute("aria-pressed",x.dataset.v==="bad"));draft.manual=false;suggestResult();toast(`${draft.tilt.toFixed(1)}° 기록. 등주 항목을 불량으로 표시했어요.`)}
  else toast(`${draft.tilt.toFixed(1)}° 기록했어요.`);
  stopTilt();
}
function stopTilt(){tilt.on=false;window.removeEventListener("deviceorientation",onTilt);const b=$("#tiltBox");if(b){b.hidden=true;b.innerHTML=""}}

/* ---------- AR finder: lights around you, over the camera view ---------- */
const AR_RANGE=200,AR_FOV=62;
let ar={on:false,stream:null,pos:null,acc:null,heading:null,hbuf:[],watch:null,raf:0,lastDraw:0};
const toRad=d=>d*Math.PI/180;
function distM(a,b){const R=6371000,dLat=toRad(b.lat-a.lat),dLng=toRad(b.lng-a.lng),s=Math.sin(dLat/2)**2+Math.cos(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(s))}
function bearing(a,b){const y=Math.sin(toRad(b.lng-a.lng))*Math.cos(toRad(b.lat)),x=Math.cos(toRad(a.lat))*Math.sin(toRad(b.lat))-Math.sin(toRad(a.lat))*Math.cos(toRad(b.lat))*Math.cos(toRad(b.lng-a.lng));return (Math.atan2(y,x)*180/Math.PI+360)%360}
const angDiff=(a,b)=>((b-a+540)%360)-180;
function openAR(){
  openSheet(`<div class="sheet-head"><div><h3 style="font-size:19px">주변 등 찾기</h3><div class="muted">휴대폰을 세워 주위를 비추면 그 방향에 있는 가로등·보안등이 거리와 함께 표시돼요.</div></div><button class="x" aria-label="닫기" data-close>×</button></div>
    <div class="arwrap" id="arwrap"><video id="arCam" playsinline muted></video><div class="fallback" id="arFb">카메라를 쓸 수 없어요.<br>아래 목록으로 가까운 등을 확인하세요.</div>
      <div class="arhud"><span id="arGps">위치 찾는 중…</span><span id="arHead">방향 –</span></div>
      <div id="arLayer"></div><div class="radar" id="radar"><i class="me"></i></div></div>
    <p class="muted" id="arNote" style="margin:8px 0 0">도심에서는 GPS 오차가 5~15m 있어요. 가까운 등은 표찰 스캔으로 확정하세요.</p>
    <div class="split"><button class="btn ghost sm" id="arRetry">센서 다시 켜기</button></div>
    <h2 style="margin-top:14px">가까운 순 <span class="muted" id="arCount"></span></h2>
    <div class="list arlist" id="arList"><div class="empty">현재 위치를 기다리는 중이에요.</div></div>`);
  arStart();
}
async function arStart(){
  arStop(false);ar={on:true,stream:null,pos:null,acc:null,heading:null,hbuf:[],watch:null,raf:0,lastDraw:0};
  const v=$("#arCam"),wrap=$("#arwrap");if(!v)return;
  // camera
  try{ar.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});v.srcObject=ar.stream;await v.play();wrap.classList.remove("nocam")}
  catch(e){wrap.classList.add("nocam")}
  // orientation (iOS asks)
  if(window.DeviceOrientationEvent){
    let ok=true;
    if(typeof DeviceOrientationEvent.requestPermission==="function"){try{ok=(await DeviceOrientationEvent.requestPermission())==="granted"}catch(e){ok=false}}
    if(ok){if("ondeviceorientationabsolute" in window)window.addEventListener("deviceorientationabsolute",onHeading);else window.addEventListener("deviceorientation",onHeading)}
    else{const h=$("#arHead");if(h)h.textContent="나침반 권한 없음"}
  }
  // position
  if(!navigator.geolocation){const g=$("#arGps");if(g)g.textContent="위치 사용 불가";return}
  ar.watch=navigator.geolocation.watchPosition(p=>{ar.pos={lat:p.coords.latitude,lng:p.coords.longitude};ar.acc=p.coords.accuracy;const g=$("#arGps");if(g)g.textContent=`GPS ±${Math.round(ar.acc)}m`;arList();arDraw()},
    ()=>{const g=$("#arGps");if(g)g.textContent="위치 권한이 없어요";const l=$("#arList");if(l)l.innerHTML=`<div class="empty">위치 권한을 허용하면 가까운 등을 보여드려요.</div>`},
    {enableHighAccuracy:true,maximumAge:3000,timeout:15000});
}
function onHeading(e){
  if(!ar.on)return;
  let h=null;
  if(typeof e.webkitCompassHeading==="number")h=e.webkitCompassHeading;
  else if(e.absolute!==false&&typeof e.alpha==="number")h=(360-e.alpha)%360;
  if(h==null)return;
  // circular smoothing
  ar.hbuf.push(h);if(ar.hbuf.length>8)ar.hbuf.shift();
  const sx=ar.hbuf.reduce((s,x)=>s+Math.cos(toRad(x)),0),sy=ar.hbuf.reduce((s,x)=>s+Math.sin(toRad(x)),0);
  ar.heading=(Math.atan2(sy,sx)*180/Math.PI+360)%360;
  const el=$("#arHead");if(el)el.textContent=`방향 ${Math.round(ar.heading)}° ${["북","북동","동","남동","남","남서","서","북서"][Math.round(ar.heading/45)%8]}`;
  const now=performance.now();if(now-ar.lastDraw>80){ar.lastDraw=now;arDraw()}
}
function arNear(){
  if(!ar.pos)return[];
  return S.lights.filter(l=>typeof l.lat==="number"&&typeof l.lng==="number").map(l=>({l,d:distM(ar.pos,l),b:bearing(ar.pos,l)})).filter(x=>x.d<=AR_RANGE).sort((x,y)=>x.d-y.d);
}
function arList(){
  const box=$("#arList"),c=$("#arCount");if(!box)return;
  const near=arNear();if(c)c.textContent=`${near.length}개 (${AR_RANGE}m 이내)`;
  box.innerHTML=near.length?near.slice(0,12).map(({l,d,b})=>`<button class="row st-${esc(l.status)}" data-ar-open="${esc(l.id)}"><span class="pole"></span>
    <span class="body"><span class="code">${esc(l.code)}</span> <span class="muted">${esc(l.kind||"가로등")}</span><span class="addr" style="display:block">${esc(l.address)}</span></span>
    <span class="meta"><span class="chip">${esc(l.status)}</span><span class="muted" style="display:block;font-size:11px;margin-top:3px">${Math.round(d)}m · ${["북","북동","동","남동","남","남서","서","북서"][Math.round(b/45)%8]}</span></span></button>`).join("")
  :`<div class="empty">${AR_RANGE}m 안에 등록된 등이 없어요.</div>`;
}
function arDraw(){
  const layer=$("#arLayer"),radar=$("#radar");if(!layer)return;
  const near=arNear();const H=ar.heading;
  if(H==null){layer.innerHTML=`<div class="aredge" style="left:50%;transform:translateX(-50%)">나침반을 기다리는 중</div>`;return}
  let left=0,right=0,html="";
  near.forEach(({l,d,b})=>{
    const diff=angDiff(H,b);
    if(Math.abs(diff)>AR_FOV/2+6){if(diff<0)left++;else right++;return}
    const x=50+diff/(AR_FOV/2)*50,y=72-Math.min(d,AR_RANGE)/AR_RANGE*42;
    html+=`<button class="arm st-${esc(l.status)} ${d>80?"far":""}" style="left:${x.toFixed(1)}%;top:${y.toFixed(1)}%" data-ar-open="${esc(l.id)}"><span class="tag"><b>${esc(l.code)}</b>${Math.round(d)}m · ${esc(l.status)}</span><span class="pin"></span></button>`;
  });
  if(left)html+=`<button class="aredge l">◀ ${left}</button>`;if(right)html+=`<button class="aredge r">${right} ▶</button>`;
  layer.innerHTML=html;
  if(radar)radar.innerHTML=`<i class="me"></i>`+near.map(({l,d,b})=>{const a=toRad(angDiff(H,b)-90),r=Math.min(d,AR_RANGE)/AR_RANGE*42;return`<i class="st-${esc(l.status)}" style="left:${(50+Math.cos(a)*r).toFixed(1)}%;top:${(50+Math.sin(a)*r).toFixed(1)}%"></i>`}).join("");
}
function arStop(reset=true){
  ar.on=false;
  if(ar.stream){ar.stream.getTracks().forEach(t=>t.stop());ar.stream=null}
  if(ar.watch!=null){navigator.geolocation.clearWatch(ar.watch);ar.watch=null}
  window.removeEventListener("deviceorientation",onHeading);window.removeEventListener("deviceorientationabsolute",onHeading);
}

/* ---------- label scanner ---------- */
let scan={ctx:null,stream:null,raf:0,found:null,busy:false,sampleImg:false,liveKey:null};
let sampleNs=null;
async function openScanner(ctx){
  scan={ctx,stream:null,raf:0,found:null,busy:false,sampleImg:false,liveKey:null};
  openSheet(`<div class="sheet-head"><div><h3 style="font-size:19px">표찰 스캔</h3><div class="muted">표찰 QR을 비추면 그 등의 상태가 화면 위에 바로 떠요. QR이 없거나 흐리면 사진으로 읽어요.</div></div><button class="x" aria-label="닫기" data-close>×</button></div>
    <div class="panel" style="padding:0;overflow:hidden;position:relative;background:#000"><video id="cam" playsinline muted style="width:100%;max-height:52vh;display:block;object-fit:cover"></video>
      <div class="reticle"></div><div id="camOv" class="ov"></div>
      <div id="camHint" class="muted" style="position:absolute;left:0;right:0;bottom:0;padding:8px 12px;background:rgba(0,0,0,.55);color:#fff;font-size:13px">카메라 준비 중…</div></div>
    <div class="split"><button class="btn ghost sm" id="scanStart">카메라 다시 켜기</button><button class="btn ghost sm" id="scanStop">카메라 끄기</button></div>
    <label class="f">또는 표찰 사진으로 읽기</label>
    <div class="photo-in"><input type="file" id="scanPhoto" accept="image/*" capture="environment"><img id="scanPrev" alt="" hidden></div>
    <p class="muted" id="scanNote">사진 인식은 AI가 표찰 글자를 읽어요. 처음 한 번 동의가 필요하고, 읽은 결과는 저장 전에 확인할 수 있어요.</p>
    <div id="scanResult"></div>`);
  if(!sampleNs&&window.claude&&window.claude.use){claude.use("sample").then(async s=>{sampleNs=s;try{const lim=s&&await s.limits();scan.sampleImg=!!(lim&&lim.images)}catch(e){}const n=$("#scanNote");if(n&&!scan.sampleImg)n.textContent="이 화면에서는 사진 인식을 쓸 수 없어요. QR 스캔이나 직접 입력을 이용하세요."})}
  startCam();
}
async function startCam(){
  stopCam(false);scan.liveKey=null;const o=$("#camOv");if(o)o.className="ov";
  const v=$("#cam"),hint=$("#camHint");if(!v)return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){hint.textContent="이 기기에서는 카메라를 쓸 수 없어요. 아래에서 사진으로 읽어 주세요.";return}
  try{
    scan.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280}},audio:false});
    v.srcObject=scan.stream;await v.play();hint.textContent="표찰 QR을 네모 안에 맞춰 주세요";
    const c=document.createElement("canvas"),g=c.getContext("2d",{willReadFrequently:true});
    const tick=()=>{
      if(!scan.stream)return;
      if(v.readyState>=2&&window.jsQR){
        const s=Math.min(v.videoWidth,v.videoHeight,640);c.width=c.height=s;
        g.drawImage(v,(v.videoWidth-s)/2,(v.videoHeight-s)/2,s,s,0,0,s,s);
        const d=g.getImageData(0,0,s,s);const r=jsQR(d.data,s,s,{inversionAttempts:"dontInvert"});
        if(r&&r.data)onLive(r.data);
      }
      scan.raf=requestAnimationFrame(tick);
    };
    scan.raf=requestAnimationFrame(tick);
  }catch(e){hint.textContent="카메라 권한이 없어요. 아래에서 사진으로 읽어 주세요."}
}
function stopCam(updateHint=true){
  cancelAnimationFrame(scan.raf);
  if(scan.stream){scan.stream.getTracks().forEach(t=>t.stop());scan.stream=null}
  const v=$("#cam");if(v)v.srcObject=null;
  const h=$("#camHint");if(h&&updateHint)h.textContent="카메라가 꺼져 있어요";
}
function onLive(text){
  const p=parseCode(text);const key=p?idOf(p.dong,p.num):"raw:"+text;
  if(scan.liveKey===key)return;scan.liveKey=key;
  const ov=$("#camOv");if(!ov)return;
  const pole=parsePole(text);
  if(!p){ov.className="ov show st-점검필요";ov.innerHTML=`<b style="font-size:15px">표찰 번호를 못 찾았어요</b><div class="muted" style="word-break:break-all">${esc(String(text).slice(0,120))}</div>`;return}
  const l=byId(key);scan.found={code:p,pole,raw:text,how:"qr"};
  const rOpen=l?S.reports.filter(r=>r.lightId===l.id&&r.status!=="완료").length:0;
  const due=l&&isDue(l);
  ov.className="ov show "+(l?`st-${l.status}`:"st-수리중");
  ov.innerHTML=l?`<b>${esc(l.code)}</b> <span class="chip">${esc(l.status)}</span>
    <div class="muted">${esc(l.kind||"가로등")} · ${esc(l.lampType||"")} · ${esc(l.address)}</div>
    <div class="muted">마지막 점검 ${fmtD(l.lastInspected)}${due?" · <span style='color:var(--sodium)'>점검주기 경과</span>":""}${rOpen?` · <span style='color:#FFB4A8'>미처리 신고 ${rOpen}건</span>`:""}</div>
    ${l.poleNo?`<div class="muted">전주 ${esc(l.poleNo)}</div>`:""}
    <div class="split" style="margin-top:8px">${scan.ctx==="report"?`<button class="btn sm" data-apply="report">신고 양식에 넣기</button>`:`<button class="btn sm" data-apply="open">${scan.ctx==="inspect"?"이 등 점검하기":"이 등 열기"}</button>`}</div>`
  :`<b>${esc(codeOf(p.dong,p.num))}</b> <span class="chip">미등록</span><div class="muted">대장에 없는 번호예요.</div>
    <div class="split" style="margin-top:8px">${scan.ctx==="report"?`<button class="btn sm" data-apply="report">신고 양식에 넣기</button>`:S.canWrite?`<button class="btn sm" data-apply="register">신규 등록</button>`:""}</div>`;
  if(navigator.vibrate)navigator.vibrate(30);
}
function onDecoded(text,how){
  stopCam(false);
  const p=parseCode(text),pole=parsePole(text);
  showScanResult({code:p,pole,raw:text,how});
}
function showScanResult(r){
  scan.found=r;const box=$("#scanResult");if(!box)return;
  const l=r.code?byId(idOf(r.code.dong,r.code.num)):null;
  const isCodeless=!r.code;
  box.innerHTML=`<div class="panel" style="margin-top:12px;border-left:5px solid ${isCodeless?"var(--warn)":l?"var(--ok)":"var(--fix)"}">
    <h3>${r.how==="qr"?"QR에서 읽음":"사진에서 읽음"}</h3>
    ${r.code?`<div style="font-size:22px;font-weight:700">${esc(r.code.dong)} ${esc(r.code.num)}</div>`:`<div>표찰 번호를 찾지 못했어요.</div>`}
    ${r.pole?`<div class="muted">한전 전주번호 ${esc(r.pole)}</div>`:""}
    ${r.kind?`<div class="muted">${esc(r.kind)}</div>`:""}
    ${r.code?(l?`<div class="muted">대장에 있는 등이에요 · ${esc(l.address)} · <span class="chip st-${esc(l.status)}">${esc(l.status)}</span></div>`:`<div class="muted">대장에 없는 번호예요. 신규 등록으로 이어갈 수 있어요.</div>`):""}
    ${r.raw&&!r.code?`<div class="muted" style="word-break:break-all;margin-top:4px">읽은 내용: ${esc(String(r.raw).slice(0,160))}</div>`:""}
    <div class="split">
      ${r.code&&l&&scan.ctx==="inspect"?`<button class="btn" data-apply="open">이 등 점검하기</button>`:""}
      ${r.code&&l&&scan.ctx==="admin"?`<button class="btn" data-apply="open">이 등 열기</button>`:""}
      ${r.code&&!l&&S.canWrite&&scan.ctx!=="report"?`<button class="btn" data-apply="register">신규 등록 양식에 넣기</button>`:""}
      ${r.code&&scan.ctx==="report"?`<button class="btn sodium" data-apply="report">신고 양식에 넣기</button>`:""}
      ${r.code&&!l&&scan.ctx==="inspect"&&S.canWrite?`<button class="btn ghost" data-apply="register">신규 등록</button>`:""}
      <button class="btn ghost" id="scanStart">다시 스캔</button>
    </div></div>`;
  box.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function applyScan(what){
  const r=scan.found;if(!r||!r.code)return;
  const {dong,num}=r.code;
  if(what==="open"){stopCam(false);openLight(idOf(dong,num));return}
  stopCam(false);closeSheet();
  if(what==="report"){S.tab="report";render();$("#rDong").value=dong;$("#rNum").value=num;$("#rLoc").focus();toast(`${codeOf(dong,num)} 번호를 넣었어요.`);return}
  if(what==="register"){S.tab="admin";render();const d=$("#nDong");if(!d){toast("등록 권한이 없어요.");return}d.value=dong;$("#nNum").value=num;if(r.pole)$("#nPole").value=r.pole;if(r.kind&&KINDS.includes(r.kind))$("#nKind").value=r.kind;$("#nAddr").scrollIntoView({behavior:"smooth",block:"center"});$("#nAddr").focus();toast(`${codeOf(dong,num)} 번호를 넣었어요. 위치를 적고 등록하세요.`)}
}
async function readLabelPhoto(file){
  const prev=$("#scanPrev");try{prev.src=await compress(file);prev.hidden=false}catch(e){}
  const box=$("#scanResult");
  // 1) try QR in the still photo first
  try{
    const img=new Image();img.src=prev.src;await img.decode();
    const c=document.createElement("canvas");c.width=img.width;c.height=img.height;const g=c.getContext("2d");g.drawImage(img,0,0);
    const d=g.getImageData(0,0,c.width,c.height);const r=window.jsQR&&jsQR(d.data,c.width,c.height);
    if(r&&r.data&&parseCode(r.data)){onDecoded(r.data,"qr");return}
  }catch(e){}
  // 2) ask Claude to read the label text
  if(!sampleNs||!scan.sampleImg){showScanResult({code:null,raw:"사진 인식을 쓸 수 없는 화면이에요. 번호를 직접 입력해 주세요.",how:"photo"});return}
  if(scan.busy)return;scan.busy=true;
  box.innerHTML=`<div class="panel" style="margin-top:12px"><span class="muted">표찰을 읽는 중…</span></div>`;
  try{
    const blob=await (await fetch(prev.src)).blob();
    const out=await sampleNs.json(`사진은 한국 광주광역시 동구의 가로등 또는 보안등 기둥(전주)입니다. 기둥에 붙은 표찰을 읽어 주세요.
- 파란색 "고장신고" 표찰: 동 이름(예: 산수동, 충장동, 동명동, 계림동, 지산동, 서남동, 학동, 학운동, 지원동)과 숫자 번호가 있습니다. 종류는 표찰에 "가로등" 또는 "보안등"으로 적혀 있습니다.
- 한국전력 전주번호판(흰색, "위험" 표시): 숫자4자리+영문1자+숫자3자리 형식(예: 9792C742)입니다.
반드시 아래 JSON 하나만 출력하세요. 못 읽은 항목은 null로 두세요.
{"dong": string|null, "num": string|null, "kind": "가로등"|"보안등"|null, "pole": string|null, "confidence": "high"|"low"}`,{images:blob,modelTier:"quick"});
    const dn=out&&typeof out.dong==="string"?out.dong.replace(/\s/g,""):"";
    const dong=DONGS.find(d=>d===dn)||DONGS.find(d=>dn&&dn.startsWith(d.replace("동","")));
    const num=out&&out.num?String(out.num).replace(/\D/g,""):"";
    const pole=parsePole(out&&out.pole||"");
    showScanResult({code:dong&&num?{dong,num}:null,pole,kind:out&&out.kind||null,raw:dong&&num?"":`인식 결과: ${JSON.stringify(out)}`,how:"photo"});
    if(out&&out.confidence==="low"&&dong&&num)toast("표찰이 흐려 번호가 틀릴 수 있어요. 확인해 주세요.");
  }catch(e){
    const msg=e&&e.code==="not_granted"?"사진 인식에 동의하지 않아 번호를 읽지 못했어요. 직접 입력해 주세요.":e&&e.code==="rate_limited"?"요청이 많아요. 잠시 후 다시 시도해 주세요.":"사진에서 표찰을 읽지 못했어요. 더 가까이서 다시 찍어 주세요.";
    showScanResult({code:null,raw:msg,how:"photo"});
  }finally{scan.busy=false}
}
document.addEventListener("change",e=>{if(e.target.id==="scanPhoto"){const f=e.target.files&&e.target.files[0];if(f)readLabelPhoto(f)}});
const _close=closeSheet;closeSheet=function(){stopCam(false);stopTilt();arStop();_close()};

render();
boot();
</script>
